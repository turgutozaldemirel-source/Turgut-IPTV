
name: Turgut IPTV Turkey Only

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update IPTV
        run: |
          cat > updater.py <<'PY'
          import requests, re, json, unicodedata
          from pathlib import Path
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          STATE = Path("stream_state.json")

          MAX_ALTERNATIVES = 5
          MAX_CHANNELS = 6000
          FAIL_LIMIT = 4
          WORKERS = 30
          TIMEOUT = 12

          SOURCES = [
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/all.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/verified.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u",
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_turkey.m3u8",
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          # Yalnızca Türkiye kanalları
          TURKISH_CHANNELS = [
              "trt", "atv", "showtv", "kanald", "startv",
              "now", "fox", "tv8", "kanal7", "beyaztv",
              "teve2", "360", "a2", "tlc", "dmax",
              "trt1", "trt2", "trtbelgesel", "trtcocuk",
              "trthaber", "trtspor", "trtmuzik",
              "aspor", "htspor", "tivibuspor", "ssport",
              "ntv", "cnnturk", "ahaber", "haberturk",
              "haberglobal", "tv100", "sozcutv", "ulketv",
              "24tv", "bloomberght", "ekoturk",
              "kral", "powerturk", "dreamturk",
              "numberone", "slowturk", "powerpop",
              "minika", "cartoonnetworkturkiye",
              "cnbce", "tvem", "kanalb",
              "flashhaber", "kanal3", "kanal26",
              "kanal7avrupa", "tvnet", "kanal24",
              "a haber", "a spor", "show tv",
              "star tv", "kanal d", "trt spor",
              "trt haber", "power turk", "dream turk",
              "ulusal kanal", "tele1", "halk tv",
              "ege tv", "benguturk", "kanal urfa",
              "kanal 23", "kanal 33", "kon tv",
              "ostim tv", "tgrt", "tgrt haber",
              "tgrt belgesel", "tv 8", "tv 100",
              "meltem tv", "line tv", "ercis tv"
          ]

          def parse_m3u(content):
              result = []
              info = None

              for line in content.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      info = line

                  elif line.startswith(("http://", "https://")) and info:
                      result.append((info, line))
                      info = None

              return result

          def read_m3u(path):
              if not path.exists():
                  return []

              try:
                  return parse_m3u(
                      path.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  )
              except Exception:
                  return []

          def channel_name(entry):
              match = re.search(r",(.+)$", entry[0])
              return match.group(1).strip() if match else "Unknown"

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              value = value.lower()
              value = re.sub(
                  r"\b(hd|fhd|uhd|4k|sd|720p|1080p)\b",
                  "",
                  value
              )
              return re.sub(r"[^a-z0-9]", "", value)

          def is_turkish(entry):
              info = entry[0]
              name = normalize(channel_name(entry))

              # Açık Türkiye ülke bilgisi
              metadata = (
                  re.search(
                      r'tvg-country="(?:TR|TUR)"',
                      info,
                      re.I
                  )
                  or re.search(
                      r'country="(?:TR|Turkey|Türkiye)"',
                      info,
                      re.I
                  )
                  or re.search(
                      r'group-title="[^"]*(?:Turkey|Türkiye|Turkish)[^"]*"',
                      info,
                      re.I
                  )
              )

              if metadata:
                  return True

              # Bilinen Türk kanal adları
              for channel in TURKISH_CHANNELS:
                  key = normalize(channel)

                  if key and (
                      name == key
                      or name.startswith(key)
                      or key in name
                  ):
                      return True

              return False

          def channel_key(entry):
              match = re.search(
                  r'tvg-id="([^"]+)"',
                  entry[0],
                  re.I
              )

              return normalize(
                  match.group(1)
                  if match else channel_name(entry)
              ) or entry[1]

          def category(entry):
              n = normalize(channel_name(entry))

              if any(x in n for x in [
                  "trtspor", "aspor", "htspor",
                  "tivibuspor", "ssport"
              ]):
                  return "Türkiye Spor"

              if any(x in n for x in [
                  "ahaber", "haberturk", "ntv",
                  "cnnturk", "trthaber",
                  "haberglobal", "sozcutv",
                  "tv100", "24tv", "ulketv",
                  "tvnet", "tele1", "halktv"
              ]):
                  return "Türkiye Haber"

              if any(x in n for x in [
                  "kral", "powerturk", "dreamturk",
                  "numberone", "slowturk",
                  "trtmuzik", "powerpop"
              ]):
                  return "Türkiye Müzik"

              if any(x in n for x in [
                  "trtcocuk", "minika",
                  "cartoonnetworkturkiye"
              ]):
                  return "Türkiye Çocuk"

              if any(x in n for x in [
                  "natgeo", "discovery", "history",
                  "viasat"
              ]):
                  return "Türkiye Belgesel"

              if any(x in n for x in [
                  "movie", "cinema", "film", "hbo"
              ]):
                  return "Türkiye Film"

              return "Türkiye Ulusal"

          def set_category(info, group):
              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  re.I
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      info,
                      count=1,
                      flags=re.I
                  )

              return info.replace(
                  "#EXTINF:-1",
                  '#EXTINF:-1 group-title="' + group + '"',
                  1
              )

          def unique(entries):
              result = []
              seen = set()

              for info, url in entries:
                  url = url.strip()

                  if (
                      url.startswith(("http://", "https://"))
                      and url not in seen
                  ):
                      seen.add(url)
                      result.append((info, url))

              return result

          def download_source(url):
              try:
                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=25
                  )

                  if r.status_code == 200:
                      entries = parse_m3u(r.text)
                      print("SOURCE", url, len(entries))
                      return entries

                  print("SOURCE HTTP", r.status_code)

              except Exception as e:
                  print("SOURCE ERROR", url, str(e))

              return []

          def probe(url):
              try:
                  r = requests.get(
                      url,
                      headers={
                          **HEADERS,
                          "Range": "bytes=0-4095"
                      },
                      timeout=(8, TIMEOUT),
                      stream=True,
                      allow_redirects=True
                  )

                  if r.status_code in (
                      401, 403, 407, 429, 451
                  ):
                      r.close()
                      return "hold"

                  if r.status_code in (404, 410):
                      r.close()
                      return "bad"

                  if r.status_code >= 500 or r.status_code in (
                      408, 425
                  ):
                      r.close()
                      return "retry"

                  if r.status_code >= 400:
                      r.close()
                      return "bad"

                  data = r.raw.read(4096)
                  ct = r.headers.get(
                      "Content-Type", ""
                  ).lower()

                  r.close()

                  if not data:
                      return "bad"

                  if "text/html" in ct:
                      return "bad"

                  if data.lstrip().lower().startswith(
                      (b"<html", b"<!doctype html")
                  ):
                      return "bad"

                  return "ok"

              except requests.RequestException:
                  return "retry"

              except Exception:
                  return "retry"

          def read_state():
              try:
                  return json.loads(
                      STATE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]

              for info, url in entries:
                  lines.extend([info, url])

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def main():
              print("TURGUT TURKEY IPTV START")

              current = read_m3u(MAIN)
              previous = read_m3u(AUTO)
              manual_old = read_m3u(MANUAL)

              previous_urls = {
                  url for _, url in previous
              }

              # Önceki ana listede manuel olarak eklenenler
              manual_new = [
                  e for e in current
                  if e[1] not in previous_urls
              ]

              manual = unique(
                  manual_old + manual_new
              )

              # Manuel listeden de yabancı kanalları çıkar
              manual = [
                  e for e in manual if is_turkish(e)
              ]

              manual_urls = {
                  url for _, url in manual
              }

              fetched = []

              with ThreadPoolExecutor(max_workers=10) as pool:
                  for entries in pool.map(
                      download_source,
                      SOURCES
                  ):
                      fetched.extend(entries)

              # Eski otomatik Türk kanallarını koru
              candidates = unique(
                  fetched + previous
              )

              # Yalnızca Türk kanallarını tut
              candidates = [
                  e for e in candidates
                  if is_turkish(e)
                  and e[1] not in manual_urls
              ]

              # Kanal başına alternatifleri sınırla
              groups = {}

              for entry in candidates:
                  groups.setdefault(
                      channel_key(entry), []
                  ).append(entry)

              limited = []

              for entries in groups.values():
                  limited.extend(
                      entries[:MAX_ALTERNATIVES]
                  )

              limited = limited[:MAX_CHANNELS]

              state = read_state()
              new_state = {}

              all_entries = unique(
                  limited + manual
              )

              print(
                  "TURKISH CHANNELS:",
                  len(all_entries)
              )

              with ThreadPoolExecutor(
                  max_workers=WORKERS
              ) as pool:
                  results = list(
                      pool.map(
                          probe,
                          [e[1] for e in all_entries]
                      )
                  )

              auto_working = []
              manual_working = []
              removed = 0

              for entry, result in zip(
                  all_entries, results
              ):
                  url = entry[1]

                  old = state.get(url, {})
                  failures = int(
                      old.get("fail_count", 0)
                  )

                  if result == "ok":
                      failures = 0

                  elif result == "hold":
                      pass

                  else:
                      failures += 1

                  if failures >= FAIL_LIMIT:
                      removed += 1
                      print(
                          "REMOVED:",
                          channel_name(entry)
                      )
                      continue

                  new_state[url] = {
                      "fail_count": failures,
                      "last_checked": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "status": result
                  }

                  updated = (
                      set_category(
                          entry[0],
                          category(entry)
                      ),
                      url
                  )

                  if url in manual_urls:
                      manual_working.append(updated)
                  else:
                      auto_working.append(updated)

              auto_working = unique(auto_working)
              manual_working = unique(manual_working)

              auto_working.sort(
                  key=lambda e: (
                      category(e),
                      channel_key(e)
                  )
              )

              manual_working.sort(
                  key=lambda e: (
                      category(e),
                      channel_key(e)
                  )
              )

              final_entries = unique(
                  manual_working + auto_working
              )

              # Kaynaklarda ani düşüş olursa eski listeyi koru
              if (
                  previous
                  and not fetched
              ):
                  raise RuntimeError(
                      "Kaynaklardan veri alınamadı. "
                      "Eski dosyalar korundu."
                  )

              if (
                  previous
                  and len(auto_working) <
                  len(previous) * 0.20
                  and len(fetched) < 20
              ):
                  raise RuntimeError(
                      "Ani kanal düşüşü. "
                      "Eski liste korundu."
                  )

              write_m3u(AUTO, auto_working)
              write_m3u(MANUAL, manual_working)
              write_m3u(MAIN, final_entries)

              STATE.write_text(
                  json.dumps(
                      new_state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              counts = {}

              for entry in final_entries:
                  group = category(entry)
                  counts[group] = (
                      counts.get(group, 0) + 1
                  )

              print("--------------------------------")
              print("Automatic:", len(auto_working))
              print("Manual:", len(manual_working))
              print("Removed:", removed)
              print("Total:", len(final_entries))
              print("CATEGORIES:")

              for group, count in sorted(counts.items()):
                  print(group, count)

              print("TURKEY ONLY UPDATE COMPLETE")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Save playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turkey only IPTV update"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json"
