          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = value.encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]", "", value)

          def clean_name(name):
              name = html.unescape(str(name))
              name = re.sub(r"\([^)]*\)|\[[^]]*\]", " ", name)
              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|hevc|4k|1080p|720p)\b",
                  " ", name, flags=re.I
              )
              return re.sub(r"\s+", " ", name).strip()

          def get_name(info):
              match = re.search(r",(.+)$", info)
              return match.group(1).strip() if match else "Bilinmeyen"

          def base_name(entry):
              info = entry[0]
              match = re.search(r'tvg-name="([^"]+)"', info, re.I)
              if match and match.group(1).strip():
                  return clean_name(match.group(1))
              name = get_name(info)
              return re.sub(
                  r"\s+Alternatif\s+\d+$", "", name, flags=re.I
              )

          def channel_key(entry):
              info = entry[0]
              if 'group-title="Türk Dizileri"' in info:
                  match = re.search(r'tvg-id="([^"]+)"', info)
                  return match.group(1) if match else norm(base_name(entry))
              match = re.search(r'tvg-id="([^"]+)"', info, re.I)
              if match:
                  raw = re.sub(r"@.*$", "", match.group(1))
                  raw = re.sub(r"\.[A-Za-z]{2}$", "", raw)
              else:
                  raw = clean_name(base_name(entry))
              key = norm(raw)
              return ALIASES.get(key, key)

          def is_radio(entry):
              name = norm(base_name(entry))
              url = entry[1].lower()
              info = entry[0].lower()
              if any(norm(x) in name for x in RADIO_WORDS):
                  return True
              if any(x in url for x in [".mp3", ".aac", ".ogg", ".opus"]):
                  return True
              return "radio" in info or "radyo" in info

          def category(entry):
              if 'group-title="Türk Dizileri"' in entry[0]:
                  return "Türk Dizileri"
              n = channel_key(entry)
              name = norm(base_name(entry))
              if is_radio(entry):
                  return "Türkiye Radyo"
              if "beinsportshaber" in n:
                  return "Türkiye Spor-Haber"
              if any(x in n or x in name for x in [
                  "trtspor", "aspor", "htspor", "ssport",
                  "tivibuspor", "sportstv", "fanatiktv",
                  "sifirtv", "bikanal", "beinsports",
                  "eurosport", "espn", "tabiispor"
              ]):
                  return "Türkiye Spor"
              if any(x in n or x in name for x in [
                  "ntv", "cnnturk", "ahaber", "haberturk",
                  "haberglobal", "tv100", "halktv",
                  "sozcutv", "tele1", "trthaber",
                  "ulusal", "benguturk", "flashhaber",
                  "ekoturk", "tvnet", "tgrthaber"
              ]):
                  return "Türkiye Haber"
              if any(x in n or x in name for x in [
                  "trtcocuk", "minika", "cartoon",
                  "nickelodeon", "disney", "cartoonito",
                  "trteba"
              ]):
                  return "Türkiye Çocuk"
              if any(x in n or x in name for x in [
                  "kral", "powerturk", "dreamturk",
                  "numberone", "slowturk", "powerlove",
                  "powerdance", "nr1"
              ]):
                  return "Türkiye Müzik"
              if any(x in n or x in name for x in [
                  "belgesel", "documentary", "diyanet"
              ]):
                  return "Türkiye Belgesel"
              if any(x in n or x in name for x in [
                  "film", "sinema", "movie", "dizi"
              ]):
                  return "Türkiye Film-Dizi"
              return "Türkiye Ulusal"

          def parse_m3u(text):
              result = []
              info = None
              for line in (text or "").splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF"):
                      info = line
                  elif line.startswith(("http://", "https://")) and info:
                      result.append((info, line))
                      info = None
              return result

          def read_m3u(path):
              if not path.exists():
                  return []
              try:
                  return parse_m3u(
                      path.read_text(encoding="utf-8", errors="ignore")
                  )
              except Exception as exc:
                  print("Dosya okuma hatası:", path, exc
