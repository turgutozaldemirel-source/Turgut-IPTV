
name: Turgut Turkey and World Sports IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: turgut-turkey-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, organize and check all channels
        run: |
          python - <<'PY'
          import re
          import json
          import socket
          import urllib.request
          import urllib.error
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TURKEY_URL = "https://iptv-org.github.io/iptv/countries/tr.m3u"
          SPORTS_URL = "https://iptv-org.github.io/iptv/categories/sports.m3u"

          PLAYLIST = Path("Turgut.m3u")
          AUTO_FILE = Path("Turgut_auto.m3u")
          FAIL_FILE = Path("manual_failures.json")

          MAX_FAILURES = 4
          TIMEOUT = 12
          MAX_WORKERS = 30

          GROUP_ORDER = [
              "Türkiye Ulusal",
              "Türkiye Avrupa",
              "Haber",
              "Spor",
              "Dünya Spor",
              "Müzik",
              "Dizi ve Eğlence",
              "Sinema",
              "Çocuk ve Çizgi Film",
              "Belgesel",
              "Ekonomi",
              "Dinî",
              "Yerel TV",
              "Kültür ve Eğitim",
              "Diğer"
          ]

          EUROPE_WORDS = [
              "show türk", "show turk", "euro d", "eurod",
              "atv avrupa", "kanal d avrupa", "trt türk",
              "trt turk", "euro star", "eurostar",
              "kanal 7 avrupa", "tv8 international"
          ]

          NATIONAL = [
              "show tv", "atv", "kanal d", "star tv",
              "now", "fox", "tv8", "kanal 7",
              "beyaz tv", "teve2", "360", "a2",
              "tv4", "trt 1", "trt 2", "trt spor",
              "trt haber", "trt belgesel", "trt çocuk",
              "trt muzik", "trt müzik", "trt avaz"
          ]

          RULES = {
              "Haber": [
                  "haber", "news", "tele 1", "habertürk",
                  "ntv", "cnn türk", "cnn turk", "tvnet",
                  "tgrt haber", "bloomberg", "halk tv",
                  "sözcü", "sozcu", "a haber", "24 tv",
                  "ulusal kanal", "ekol tv"
              ],
              "Müzik": [
                  "müzik", "muzik", "music", "power",
                  "kral pop", "kral tv", "dream türk",
                  "dream turk", "nr1", "number one",
                  "slow türk", "slow turk", "dream music"
              ],
              "Çocuk ve Çizgi Film": [
                  "çocuk", "cocuk", "cartoon", "nick",
                  "disney junior", "baby tv", "minika",
                  "rafadan", "pırıl", "piril",
                  "çizgi", "cizgi", "boomerang"
              ],
              "Sinema": [
                  "sinema", "cinema", "movie", "film",
                  "action", "premium cinema"
              ],
              "Belgesel": [
                  "belgesel", "documentary", "discovery",
                  "nat geo", "national geographic",
                  "animal planet", "history"
              ],
              "Ekonomi": [
                  "ekonomi", "finans", "business",
                  "borsa", "ekotürk", "ekoturk"
              ],
              "Dinî": [
                  "diyanet", "dini", "dinî", "kuran",
                  "kur'an", "mekke", "medine"
              ],
              "Yerel TV": [
                  "yerel", "belediye", "kent tv",
                  "kon tv", "kanal 23", "kanal 33",
                  "ege tv", "rumeli tv"
              ],
              "Kültür ve Eğitim": [
                  "eğitim", "egitim", "üniversite",
                  "universite", "kültür", "kultur"
              ],
              "Dizi ve Eğlence": [
                  "dizi", "eğlence", "eglence",
                  "komedi", "magazin", "lifestyle"
              ]
          }

          TURKISH_SPORTS = [
              "trt spor", "a spor", "aspor",
              "tivibu spor", "tabii spor",
              "bein sports tr", "beinsports tr",
              "beinsports 1", "beinsports 2",
              "beinsports 3", "beinsports 4",
              "s sport", "ssport", "tjk tv"
          ]

          SPORTS_WORDS = [
              "sport", "sports", "spor", "espn",
              "eurosport", "bein", "sky sport",
              "fox sports", "dazn", "supersport",
              "sport tv", "canal+ sport", "canal plus sport",
              "tennis", "golf", "racing", "motorsport",
              "formula", "f1", "football", "soccer",
              "basketball", "cricket", "fight", "ufc",
              "wwe", "hockey", "rugby", "volleyball",
              "liga max", "limax", "l1 max",
              "bicolor", "liga 1"
          ]

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8-sig")

          def parse_entries(content):
              entries = []
              current = []

              for line in content.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      if current:
                          entries.append(current)
                      current = [line]
                  elif current and line:
                      current.append(line)

              if current:
                  entries.append(current)

              return [
                  entry for entry in entries
                  if get_url(entry)
              ]

          def get_url(entry):
              for line in entry:
                  if line.startswith(("http://", "https://")):
                      return line.strip()
              return None

          def get_name(info):
              if "," in info:
                  return info.split(",", 1)[1].strip()
              return "İsimsiz Kanal"

          def is_europe(name):
              value = name.casefold()
              return any(
                  word in value for word in EUROPE_WORDS
              )

          def get_group(name, world_sports=False, turkey_source=False):
              value = re.sub(
                  r"\s+", " ", name.casefold()
              ).strip()

              if is_europe(value):
                  return "Türkiye Avrupa"

              if world_sports:
                  return "Dünya Spor"

              if any(
                  value == n or value.startswith(n + " ")
                  for n in NATIONAL
              ):
                  return "Türkiye Ulusal"

              if any(word in value for word in TURKISH_SPORTS):
                  return "Spor"

              for group, words in RULES.items():
                  if any(word in value for word in words):
                      return group

              if any(word in value for word in SPORTS_WORDS):
                  return "Spor" if turkey_source else "Dünya Spor"

              return "Diğer"

          def set_group(entry, world_sports=False, turkey_source=False):
              entry = list(entry)
              info = entry[0]
              name = get_name(info)

              group = get_group(
                  name,
                  world_sports=world_sports,
                  turkey_source=turkey_source
              )

              if re.search(r'group-title="[^"]*"', info, re.I):
                  info = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.I
                  )
              else:
                  comma = info.find(",")
                  if comma >= 0:
                      info = (
                          info[:comma]
                          + f' group-title="{group}"'
                          + info[comma:]
                      )

              entry[0] = info
              return entry

          def get_saved_group(entry):
              match = re.search(
                  r'group-title="([^"]*)"',
                  entry[0],
                  re.I
              )
              if match:
                  return match.group(1)
              return "Diğer"

          def sort_key(entry):
              group = get_saved_group(entry)
              name = get_name(entry[0])

              try:
                  position = GROUP_ORDER.index(group)
              except ValueError:
                  position = len(GROUP_ORDER)

              return position, name.casefold()

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]

              for entry in entries:
                  lines.extend(entry)

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def check_stream(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "VLC/3.0.20 LibVLC/3.0.20",
                      "Range": "bytes=0-2047"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=TIMEOUT
                  ) as response:
                      response.read(512)
                      return (
                          True
                          if 200 <= response.status < 400
                          else False
                      )

              except urllib.error.HTTPError as error:
                  if error.code in (
                      408, 425, 429, 500, 502, 503, 504
                  ):
                      return None
                  return False

              except (
                  socket.timeout,
                  TimeoutError,
                  urllib.error.URLError
              ):
                  return None

              except Exception:
                  return None

          def load_failures():
              if not FAIL_FILE.exists():
                  return {}

              try:
                  data = json.loads(
                      FAIL_FILE.read_text(encoding="utf-8")
                  )
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}

          try:
              print("Kaynaklar indiriliyor...")

              turkey_entries = parse_entries(
                  download(TURKEY_URL)
              )
              sports_entries = parse_entries(
                  download(SPORTS_URL)
              )

              if not turkey_entries:
                  raise RuntimeError("Türkiye kaynağı boş!")

              if not sports_entries:
                  raise RuntimeError("Spor kaynağı boş!")

              print("Türkiye kaynak:", len(turkey_entries))
              print("Dünya spor kaynak:", len(sports_entries))

              # Önceki otomatik listeyi oku.
              previous_auto = (
                  parse_entries(
                      AUTO_FILE.read_text(encoding="utf-8")
                  )
                  if AUTO_FILE.exists()
                  else []
              )

              previous_auto_urls = {
                  get_url(entry) for entry in previous_auto
              }

              # Mevcut ana listeyi oku.
              current_entries = (
                  parse_entries(
                      PLAYLIST.read_text(encoding="utf-8")
                  )
                  if PLAYLIST.exists()
                  else []
              )

              source_entries = []
              source_seen = set()

              # Türkiye kanallarını ekle.
              for entry in turkey_entries:
                  url = get_url(entry)

                  if not url or url in source_seen:
                      continue

                  source_seen.add(url)
                  source_entries.append(
                      (entry, False, True)
                  )

              # Dünya spor kanallarını ekle.
              for entry in sports_entries:
                  url = get_url(entry)

                  if not url or url in source_seen:
                      continue

                  source_seen.add(url)
                  source_entries.append(
                      (entry, True, False)
                  )

              # Manuel kanalları ayır.
              if AUTO_FILE.exists():
                  manual_entries = [
                      entry for entry in current_entries
                      if get_url(entry) not in previous_auto_urls
                  ]
              else:
                  manual_entries = [
                      entry for entry in current_entries
                      if get_url(entry) not in source_seen
                  ]

              # Kaynak ve manuel kanalları URL ile tekilleştir.
              manual_unique = []
              manual_seen = set()

              for entry in manual_entries:
                  url = get_url(entry)

                  if not url or url in manual_seen:
                      continue

                  if url in source_seen:
                      continue

                  manual_seen.add(url)
                  manual_unique.append(entry)

              # Otomatik ve manuel bütün kanalları kontrol et.
              check_items = []
              check_seen = set()

              for entry, world, turkey in source_entries:
                  url = get_url(entry)
                  if url and url not in check_seen:
                      check_seen.add(url)
                      check_items.append(entry)

              for entry in manual_unique:
                  url = get_url(entry)
                  if url and url not in check_seen:
                      check_seen.add(url)
                      check_items.append(entry)

              print("Kontrol edilecek toplam:", len(check_items))

              results = {}

              with ThreadPoolExecutor(
                  max_workers=MAX_WORKERS
              ) as executor:

                  jobs = {
                      executor.submit(
                          check_stream, get_url(entry)
                      ): entry
                      for entry in check_items
                  }

                  for future in as_completed(jobs):
                      entry = jobs[future]
                      url = get_url(entry)

                      try:
                          results[url] = future.result()
                      except Exception:
                          results[url] = None

              failures = load_failures()

              kept_auto = []
              kept_manual = []

              working = 0
              removed = 0
              temporary = 0
              failed_count = 0

              def process_entry(entry, is_auto, world=False, turkey=False):
                  global_dummy = None
                  nonlocal_dummy = None

                  url = get_url(entry)
                  name = get_name(entry[0])
                  result = results.get(url)

                  if result is True:
                      failures.pop(url, None)
                      working += 1
                      organized = set_group(
                          entry,
                          world_sports=world,
                          turkey_source=turkey
                      )

                      if is_auto:
                          kept_auto.append(organized)
                      else:
                          kept_manual.append(organized)

                      return

                  if result is None:
                      temporary += 1

                      organized = set_group(
                          entry,
                          world_sports=world,
                          turkey_source=turkey
                      )

                      if is_auto:
                          kept_auto.append(organized)
                      else:
                          kept_manual.append(organized)

                      return

                  count = min(
                      MAX_FAILURES,
                      int(failures.get(url, 0)) + 1
                  )

                  failures[url] = count
                  failed_count += 1

                  print(
                      "Yayın hatası:",
                      name,
                      count,
                      "/", MAX_FAILURES
                  )

                  if count >= MAX_FAILURES:
                      removed += 1
                      print("4 başarısız kontrol: kaldırıldı:", name)
                      return

                  organized = set_group(
                      entry,
                      world_sports=world,
                      turkey_source=turkey
                  )

                  if is_auto:
                      kept_auto.append(organized)
                  else:
                      kept_manual.append(organized)

              # Python sayaçlarını güvenli şekilde güncelle.
              def process_all():
                  nonlocal working, removed, temporary, failed_count

                  for entry, world, turkey in source_entries:
                      url = get_url(entry)
                      result = results.get(url)
                      name = get_name(entry[0])

                      if result is True:
                          failures.pop(url, None)
                          working += 1
                          kept_auto.append(
                              set_group(
                                  entry,
                                  world_sports=world,
                                  turkey_source=turkey
                              )
                          )

                      elif result is None:
                          temporary += 1
                          kept_auto.append(
                              set_group(
                                  entry,
                                  world_sports=world,
                                  turkey_source=turkey
                              )
                          )

                      else:
                          count = min(
                              MAX_FAILURES,
                              int(failures.get(url, 0)) + 1
                          )
                          failures[url] = count
                          failed_count += 1

                          print(
                              "Otomatik:",
                              name,
                              "başarısız:",
                              count,
                              "/", MAX_FAILURES
                          )

                          if count >= MAX_FAILURES:
                              removed += 1
                              print("Kaldırıldı:", name)
                          else:
                              kept_auto.append(
                                  set_group(
                                      entry,
                                      world_sports=world,
                                      turkey_source=turkey
                                  )
                              )

                  for entry in manual_unique:
                      url = get_url(entry)
                      result = results.get(url)
                      name = get_name(entry[0])

                      if result is True:
                          failures.pop(url, None)
                          working += 1
                          kept_manual.append(
                              set_group(entry)
                          )

                      elif result is None:
                          temporary += 1
                          kept_manual.append(
                              set_group(entry)
                          )

                      else:
                          count = min(
                              MAX_FAILURES,
                              int(failures.get(url, 0)) + 1
                          )
                          failures[url] = count
                          failed_count += 1

                          print(
                              "Manuel:",
                              name,
                              "başarısız:",
                              count,
                              "/", MAX_FAILURES
                          )

                          if count >= MAX_FAILURES:
                              removed += 1
                              print("Manuel yayın kaldırıldı:", name)
                          else:
                              kept_manual.append(
                                  set_group(entry)
                              )

              process_all()

              # Gruplara göre sırala.
              kept_auto.sort(key=sort_key)
              kept_manual.sort(key=sort_key)

              # Ana listede otomatik ve manuel kayıtları birleştir.
              combined = []
              final_urls = set()

              for entry in kept_auto + kept_manual:
                  url = get_url(entry)

                  if not url or url in final_urls:
                      continue

                  final_urls.add(url)
                  combined.append(entry)

              combined.sort(key=sort_key)

              # Sonucu kaydet.
              write_m3u(AUTO_FILE, kept_auto)
              write_m3u(PLAYLIST, combined)

              FAIL_FILE.write_text(
                  json.dumps(
                      failures,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("================================")
              print("Otomatik kanallar:", len(kept_auto))
              print("Manuel kanallar:", len(kept_manual))
              print("Çalışan yayınlar:", working)
              print("Geçici hatalar:", temporary)
              print("Başarısız kontroller:", failed_count)
              print("4 kontrolde kaldırılan:", removed)
              print("TOPLAM KANAL:", len(combined))
              print("Güncelleme başarılı!")
              print("================================")

          except Exception as error:
              print("GÜNCELLEME HATASI:", error)
              raise
          PY

      - name: Save updated playlists
        run: |
          git config user.name "Turgut IPTV Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Turgut.m3u Turgut_auto.m3u manual_failures.json

          git diff --cached --quiet || git commit -m "Organize and update Turkish and world IPTV channels"

          git push
