
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update IPTV
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > updater.py <<'PY'
          import re
          import json
          import time
          import html
          import unicodedata
          import requests
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          BACKUP = Path("yedek-445.m3u")
          STATE = Path("stream_state.json")
          REPORT = Path("Turgut_report.txt")

          TIMEOUT = (8, 15)
          WORKERS = 20
          FAIL_LIMIT = 4
          MAX_ALTERNATIVES = 8
          MAX_TEST_PER_CHANNEL = 40
          MAX_SOURCE_ITEMS = 10000

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36",
              "Accept": "*/*",
              "Connection": "keep-alive"
          }

          # Eski kaynakların korunmuştur.
          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/languages/tur.m3u",
              "https://streams.uzunmuhalefet.com/lists/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u"
          ]

          OFFICIAL_SITES = {
              "ATV": "https://www.atv.com.tr/canli-yayin",
              "A2": "https://www.a2tv.com.tr/canli-yayin",
              "Show TV": "https://www.showtv.com.tr/canli-yayin",
              "Kanal D": "https://www.kanald.com.tr/canli-yayin",
              "Star TV": "https://www.startv.com.tr/canli-yayin",
              "NOW": "https://www.nowtv.com.tr/canli-yayin",
              "TV8": "https://www.tv8.com.tr/canli-yayin",
              "TRT 1": "https://www.trt1.com.tr/canli-izle",
              "TRT Haber": "https://www.trthaber.com/canli-yayin-izle.html",
              "TRT Spor": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Spor Yıldız": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Çocuk": "https://www.trtcocuk.net.tr/",
              "TRT Belgesel": "https://www.trtbelgesel.com.tr/",
              "A Haber": "https://www.ahaber.com.tr/canli-yayin",
              "A Spor": "https://www.aspor.com.tr/webtv/canli-yayin",
              "NTV": "https://www.ntv.com.tr/canli-yayin",
              "CNN Türk": "https://www.cnnturk.com/canli-yayin",
              "Haber Global": "https://haberglobal.com.tr/canli-yayin",
              "Habertürk": "https://www.haberturk.com/canliyayin",
              "TV100": "https://www.tv100.com/canli-yayin",
              "Halk TV": "https://halktv.com.tr/canli-yayin",
              "Sözcü TV": "https://www.sozcu.com.tr/tv/",
              "Kanal 7": "https://www.kanal7.com/canli-izle",
              "Beyaz TV": "https://www.beyaztv.com.tr/canli-yayin",
              "360": "https://www.tv360.com.tr/canli-yayin",
              "teve2": "https://www.teve2.com.tr/canli-yayin",
              "Bloomberg HT": "https://www.bloomberght.com/tv",
              "Bi Kanal": "https://www.bikanal.com/",
              "Sıfır TV": "https://www.sifirtv.com/",
              "Fanatik TV": "https://www.fanatik.com.tr/",
              "Kral TV": "https://www.kralmuzik.com.tr/",
              "PowerTürk": "https://www.powerturk.com/",
              "Diyanet TV": "https://www.diyanet.tv/",
              "beIN SPORTS HABER": "https://bein-sports.com.tr/canli-tv"
          }

          CHANNELS = [
              "atv", "a2", "show tv", "kanal d", "star tv",
              "now", "tv8", "tv8,5", "trt 1", "trt 2",
              "trt haber", "trt spor", "trt spor yıldız",
              "trt çocuk", "trt belgesel", "trt müzik",
              "trt türk", "a haber", "a spor", "ntv",
              "cnn türk", "haber global", "habertürk",
              "tv100", "halk tv", "sözcü tv", "tele1",
              "tvnet", "beyaz tv", "kanal 7", "360",
              "teve2", "bloomberg ht", "ekotürk",
              "tgrt haber", "ülke tv", "ulusal kanal",
              "bengütürk", "flash haber", "kral tv",
              "kral pop", "powertürk", "dream türk",
              "number one türk", "slow türk", "minika çocuk",
              "minika go", "cartoon network", "kanal b",
              "tv5", "diyanet tv", "bi kanal", "sıfır tv",
              "fanatik tv", "sportstv", "sports tv",
              "trt avaz", "trt world", "trt arabi",
              "trt kurdi", "trt okul", "trt eba",
              "minika", "cartoonito", "disney channel",
              "nickelodeon", "power tv", "power dance",
              "power love", "nr1", "nr1 türk", "nr1 tv",
              "beinsports haber", "bein sports haber",
              "beinsports 1", "beinsports 2",
              "beinsports 3", "beinsports 4", "beinsports 5",
              "tabii spor", "tabii spor 1", "tabii spor 2"
          ]

          FOREIGN_BLOCK = [
              "aljazeera", "mbc", "rotana", "dubai",
              "arabic", "iraq", "iran", "syria", "egypt",
              "saudi", "kuwait", "qatar", "oman", "bahrain",
              "yemen", "jordan", "lebanon", "morocco",
              "algeria", "tunisia", "libya", "pakistan",
              "india", "bangladesh", "germany", "france",
              "italy", "spain", "portugal", "england",
              "united kingdom", "usa", "america", "canada",
              "brazil", "mexico", "peru", "argentina",
              "chile", "colombia", "ecuador", "bolivia"
          ]

          ALIASES = {
              "atvhd": "atv",
              "atvturkiye": "atv",
              "a2tv": "a2",
              "a2hd": "a2",
              "showtvhd": "showtv",
              "kanaldhd": "kanald",
              "startvhd": "startv",
              "nowtv": "now",
              "nowturkiye": "now",
              "tv8hd": "tv8",
              "trt1hd": "trt1",
              "trthaberhd": "trthaber",
              "trtsporhd": "trtspor",
              "asporhd": "aspor",
              "ahaberhd": "ahaber",
              "bikanaltv": "bikanal",
              "sifirtvhd": "sifirtv",
              "beinsportshaber": "beinsportshaber",
              "beinsporthaber": "beinsportshaber",
              "beinsportshaberhd": "beinsportshaber"
          }

          RADIO_WORDS = [
              "radyo", "radio", "fm", "am", "slowturk",
              "joyturk", "kralfm", "powerturk", "fenomen",
              "metro fm", "virgin radio", "power fm"
          ]

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = value.encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]", "", value)

          def clean_name(name):
              name = html.unescape(str(name))
              name = re.sub(r"\([^)]*\)|\[[^]]*\]", " ", name)
              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|hevc|4k|1080p|720p)\b",
                  " ", name, flags=re.I
              )
              return re.sub(r"\s+", " ", name).strip()

          def get_name(info):
              match = re.search(r",(.+)$", info)
              return match.group(1).strip() if match else "Bilinmeyen"

          def base_name(entry):
              info = entry[0]
              match = re.search(r'tvg-name="([^"]+)"', info, re.I)
              if match and match.group(1).strip():
                  return clean_name(match.group(1))
              name = get_name(info)
              return re.sub(
                  r"\s+Alternatif\s+\d+$", "", name, flags=re.I
              )

          def channel_key(entry):
              info = entry[0]
              match = re.search(r'tvg-id="([^"]+)"', info, re.I)
              if match:
                  raw = re.sub(r"@.*$", "", match.group(1))
                  raw = re.sub(r"\.[A-Za-z]{2}$", "", raw)
              else:
                  raw = clean_name(base_name(entry))
              key = norm(raw)
              return ALIASES.get(key, key)

          def is_radio(entry):
              name = norm(base_name(entry))
              url = entry[1].lower()
              info = entry[0].lower()
              if any(norm(x) in name for x in RADIO_WORDS):
                  return True
              if any(x in url for x in [".mp3", ".aac", ".ogg", ".opus"]):
                  return True
              if "radio" in info or "radyo" in info:
                  return True
              return False

          def category(entry):
              n = channel_key(entry)
              name = norm(base_name(entry))

              if is_radio(entry):
                  return "Türkiye Radyo"

              if "beinsportshaber" in n:
                  return "Türkiye Spor-Haber"

              if any(x in n or x in name for x in [
                  "trtspor", "aspor", "htspor", "ssport",
                  "tivibuspor", "sportstv", "fanatiktv",
                  "sifirtv", "bikanal", "beinsports",
                  "eurosport", "espn", "tabiispor"
              ]):
                  return "Türkiye Spor"

              if any(x in n or x in name for x in [
                  "ntv", "cnnturk", "ahaber", "haberturk",
                  "haberglobal", "tv100", "halktv",
                  "sozcutv", "tele1", "trthaber",
                  "ulusal", "benguturk", "flashhaber",
                  "ekoturk", "tvnet", "tgrthaber"
              ]):
                  return "Türkiye Haber"

              if any(x in n or x in name for x in [
                  "trtcocuk", "minika", "cartoon",
                  "nickelodeon", "disney", "cartoonito",
                  "trteba"
              ]):
                  return "Türkiye Çocuk"

              if any(x in n or x in name for x in [
                  "kral", "powerturk", "dreamturk",
                  "numberone", "slowturk", "powerlove",
                  "powerdance", "nr1"
              ]):
                  return "Türkiye Müzik"

              if any(x in n or x in name for x in [
                  "belgesel", "documentary", "diyanet"
              ]):
                  return "Türkiye Belgesel"

              if any(x in n or x in name for x in [
                  "film", "sinema", "movie", "dizi"
              ]):
                  return "Türkiye Film-Dizi"

              return "Türkiye Ulusal"

          def parse_m3u(text):
              result = []
              info = None
              for line in (text or "").splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF"):
                      info = line
                  elif line.startswith(("http://", "https://")) and info:
                      result.append((info, line))
                      info = None
              return result

          def read_m3u(path):
              if not path.exists():
                  return []
              try:
                  return parse_m3u(
                      path.read_text(encoding="utf-8", errors="ignore")
                  )
              except Exception as exc:
                  print("Dosya okuma hatası:", path, exc)
                  return []

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]
              for info, url in entries:
                  lines.extend([info, url])
              path.write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )

          def unique(entries):
              seen = set()
              result = []
              for info, url in entries:
                  url = url.strip()
                  if url and url not in seen:
                      seen.add(url)
                      result.append((info, url))
              return result

          def is_turkish(entry):
              name = base_name(entry)
              n = norm(clean_name(name))
              info = entry[0]

              if not n:
                  return False

              if re.search(r"[\u0600-\u06FF]", name):
                  return False

              if any(norm(x) in n for x in FOREIGN_BLOCK):
                  return False

              country = re.search(
                  r'tvg-country="([^"]+)"', info, re.I
              )

              if country:
                  codes = [
                      x.strip().upper()
                      for x in country.group(1).split(",")
                  ]
                  if not any(
                      x in ["TR", "TUR", "TURKEY"]
                      for x in codes
                  ):
                      return False

              tr_id = re.search(
                  r'tvg-id="[^"]+\.tr(@[^"]*)?"', info, re.I
              )

              allowed = {norm(x) for x in CHANNELS}
              return (
                  n in allowed
                  or bool(country)
                  or bool(tr_id)
              )

          def fetch_text(url, timeout=22):
              try:
                  response = requests.get(
                      url, headers=HEADERS, timeout=timeout
                  )
                  if response.status_code != 200:
                      print("Kaynak HTTP", response.status_code, url)
                      return None
                  return response.text
              except Exception as exc:
                  print("Kaynak hatası:", url, exc)
                  return None

          def fetch_m3u(url):
              text = fetch_text(url)
              if not text:
                  return []
              entries = parse_m3u(text)[:MAX_SOURCE_ITEMS]
              print("Kaynak:", url, "kayıt:", len(entries))
              return entries

          def extract_streams(text):
              patterns = [
                  r'https?:\\?/\\?/[^"\'\s<>]+?\.m3u8(?:\?[^"\'\s<>]*)?',
                  r'https?://[^"\'\s<>]+?\.m3u8(?:\?[^"\'\s<>]*)?',
                  r'https?://[^"\'\s<>]+?\.mpd(?:\?[^"\'\s<>]*)?',
                  r'https?://[^"\'\s<>]+?\.(?:mp3|aac|ogg|opus)(?:\?[^"\'\s<>]*)?'
              ]
              found = []
              for pattern in patterns:
                  for item in re.findall(pattern, text, re.I):
                      item = item.replace("\\/", "/").rstrip("\\);,")
                      if item.startswith("http"):
                          found.append(item)
              return list(dict.fromkeys(found))

          def official_scan(channel, page_url):
              found = []
              text = fetch_text(page_url, 18)
              if not text:
                  return []

              text = text.replace("\\/", "/").replace("&amp;", "&")
              found.extend(extract_streams(text))

              scripts = re.findall(
                  r'<script[^>]+src=["\']([^"\']+)', text, re.I
              )
              for src in scripts[:15]:
                  js = fetch_text(urljoin(page_url, src), 12)
                  if js:
                      found.extend(extract_streams(js))

              frames = re.findall(
                  r'<iframe[^>]+src=["\']([^"\']+)', text, re.I
              )
              for frame in frames[:4]:
                  frame_text = fetch_text(urljoin(page_url, frame), 12)
                  if frame_text:
                      found.extend(extract_streams(frame_text))

              group = category((
                  '#EXTINF:-1 tvg-name="' + channel + '",' + channel,
                  page_url
              ))

              print("Resmî tarama:", channel, "bulunan:", len(found))

              return [
                  (
                      '#EXTINF:-1 group-title="' + group +
                      '" tvg-name="' + channel + '",' + channel,
                      url
                  )
                  for url in dict.fromkeys(found)
              ]

          def allowed_url(url):
              return url.startswith(("http://", "https://"))

          def check_http(url):
              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True
                  )
                  status = response.status_code
                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).lower()
                  first = next(response.iter_content(1024), b"")
                  response.close()

                  if status in (401, 403):
                      return False, f"HTTP {status} yetki/erişim reddi"
                  if status == 404:
                      return False, "HTTP 404 bulunamadı"
                  if status != 200:
                      return False, f"HTTP {status}"
                  if not first:
                      return False, "Boş yayın cevabı"
                  if b"<html" in first.lower() or b"<!doctype html" in first.lower():
                      return False, "HTML sayfası, medya akışı değil"

                  return True, "HTTP erişilebilir"
              except requests.exceptions.Timeout:
                  return False, "Zaman aşımı"
              except Exception as exc:
                  return False, str(exc)[:100]

          def check_hls(url, depth=0):
              if depth > 1:
                  return False, "HLS varyant derinliği"

              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True
                  )
                  status = response.status_code

                  if status in (401, 403):
                      response.close()
                      return False, f"HTTP {status} yetki/erişim reddi"
                  if status != 200:
                      response.close()
                      return False, f"HTTP {status}"

                  data = response.raw.read(65536, decode_content=True)
                  response.close()

                  text = data.decode("utf-8", errors="ignore").lstrip()
                  if not text.startswith("#EXTM3U"):
                      return False, "Geçerli HLS manifesti değil"

                  lines = [x.strip() for x in text.splitlines() if x.strip()]

                  # Master playlist: bir varyant manifestini de kontrol et.
                  for index, line in enumerate(lines):
                      if "#EXT-X-STREAM-INF" in line:
                          for child in lines[index + 1:]:
                              if not child.startswith("#"):
                                  return check_hls(
                                      urljoin(url, child), depth + 1
                                  )
                          return False, "Master playlist varyantı yok"

                  # Media playlist: ilk segmenti kontrol et.
                  segment = next(
                      (
                          line for line in lines
                          if not line.startswith("#")
                      ),
                      None
                  )

                  if segment:
                      segment_url = urljoin(url, segment)
                      ok, reason = check_http(segment_url)
                      if ok:
                          return True, "HLS manifest ve segment erişilebilir"
                      return False, "Segment: " + reason

                  if "#EXT-X-ENDLIST" in text:
                      return True, "HLS sonlu liste"

                  return False, "Manifestte segment bulunamadı"

              except requests.exceptions.Timeout:
                  return False, "HLS zaman aşımı"
              except Exception as exc:
                  return False, str(exc)[:100]

          def check_stream(entry):
              url = entry[1]
              path = urlparse(url).path.lower()

              # Radyo akışları: MP3/AAC/OGG/Opus gibi formatlar.
              if is_radio(entry):
                  return check_http(url)

              # Bu bot otomatik TV doğrulamasında HLS kullanır.
              if path.endswith(".m3u8") or ".m3u8" in path:
                  return check_hls(url)

              # Diğer formatlar yalnızca erişim kontrolünden geçer.
              return check_http(url)

          def load_state():
              if not STATE.exists():
                  return {}
              try:
                  return json.loads(
                      STATE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def get_manual():
              if MANUAL.exists():
                  return unique(read_m3u(MANUAL))
              if BACKUP.exists():
                  data = unique(read_m3u(BACKUP))
                  write_m3u(MANUAL, data)
                  return data
              if MAIN.exists():
                  old_auto_urls = {u for _, u in read_m3u(AUTO)}
                  recovered = [
                      x for x in read_m3u(MAIN)
                      if x[1] not in old_auto_urls
                  ]
                  write_m3u(MANUAL, recovered)
                  return recovered
              write_m3u(MANUAL, [])
              return []

          def main():
              start = time.time()
              old_state = load_state()
              manual = get_manual()

              # İlk yedek bir kere oluşturulur, mevcut yedeğe dokunulmaz.
              if not BACKUP.exists():
                  write_m3u(BACKUP, manual)

              manual = unique(manual)
              manual_urls = {url for _, url in manual}
              manual_keys = {channel_key(x) for x in manual}

              previous = read_m3u(AUTO)
              print("Manuel kayıt:", len(manual))
              print("Önceki otomatik kayıt:", len(previous))

              fetched = []
              with ThreadPoolExecutor(max_workers=10) as pool:
                  for result in pool.map(fetch_m3u, SOURCES):
                      fetched.extend(result)

              official_items = list(OFFICIAL_SITES.items())
              with ThreadPoolExecutor(max_workers=8) as pool:
                  for result in pool.map(
                      lambda item: official_scan(item[0], item[1]),
                      official_items
                  ):
                      fetched.extend(result)

              # Elle eklenen kaynak dosyası:
              # Kanal Adı|https://adres/yayin.m3u8
              # Radyo adı|https://adres/radyo.mp3
              extra = Path("ekstra_alternatifler.txt")
              if extra.exists():
                  for raw in extra.read_text(
                      encoding="utf-8", errors="ignore"
                  ).splitlines():
                      line = raw.strip()
                      if not line or line.startswith("#") or "|" not in line:
                          continue

                      name, url = [
                          x.strip() for x in line.split("|", 1)
                      ]
                      if not allowed_url(url):
                          continue

                      group = (
                          "Türkiye Radyo"
                          if any(norm(x) in norm(name) for x in RADIO_WORDS)
                          or any(x in url.lower() for x in [".mp3", ".aac", ".ogg", ".opus"])
                          else category((
                              '#EXTINF:-1,' + name, url
                          ))
                      )

                      fetched.append((
                          '#EXTINF:-1 group-title="' + group +
                          '" tvg-name="' + name + '",' + name,
                          url
                      ))

              # Eski otomatik kayıtlar önce gelir; yeni kaynaklar eklenir.
              candidates = [
                  item for item in previous + fetched
                  if item[1] not in manual_urls
                  and is_turkish(item)
                  and allowed_url(item[1])
              ]
              candidates = unique(candidates)

              groups = {}
              for entry in candidates:
                  key = channel_key(entry)
                  if key:
                      groups.setdefault(key, []).append(entry)

              selected = []
              for key, entries in groups.items():
                  selected.extend(
                      unique(entries)[:MAX_TEST_PER_CHANNEL]
                  )

              print("Kontrol edilecek aday yayın:", len(selected))

              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  checks = list(pool.map(check_stream, selected))

              per_channel = {}
              new_state = {}
              failed_log = []
              good_count = 0
              stale_count = 0
              rejected_count = 0

              for entry, result in zip(selected, checks):
                  ok, reason = result
                  url = entry[1]
                  key = channel_key(entry)
                  old = old_state.get(url, {})
                  failures = int(old.get("failures", 0))

                  if ok:
                      failures = 0
                      per_channel.setdefault(key, []).append(entry)
                      good_count += 1
                      status = "working"
                  else:
                      failures += 1
                      rejected_count += 1
                      status = "failed"

                      # 401/403 yetki hatalarında eski kaydı koruma.
                      auth_error = (
                          "401" in reason or "403" in reason
                      )

                      # Diğer geçici hatalarda eski çalışan kaydı
                      # sınırlı süre koru; ilk kez görülenleri ekleme.
                      if (
                          not auth_error
                          and url in old_state
                          and failures < FAIL_LIMIT
                      ):
                          per_channel.setdefault(key, []).append(entry)
                          stale_count += 1
                          status = "temporary"

                      failed_log.append(
                          f"{base_name(entry)} | {reason} | {url}"
                      )

                  new_state[url] = {
                      "failures": failures,
                      "channel": base_name(entry),
                      "status": status,
                      "last_check": int(time.time()),
                      "reason": reason
                  }

              # Kanal başına en fazla 8 alternatif.
              auto_working = []
              for key, entries in per_channel.items():
                  auto_working.extend(
                      unique(entries)[:MAX_ALTERNATIVES]
                  )

              auto_working = unique(auto_working)

              final_auto = []
              display_counts = {}

              for entry in auto_working:
                  key = channel_key(entry)
                  start_number = 1 if key in manual_keys else 0
                  display_counts[key] = (
                      display_counts.get(key, start_number) + 1
                  )
                  number = display_counts[key]

                  original = base_name(entry)
                  group = category(entry)

                  display = (
                      original if number == 1
                      else original + " Alternatif " + str(number)
                  )

                  info = (
                      '#EXTINF:-1 group-title="' + group +
                      '" tvg-id="' + key +
                      '" tvg-name="' + original +
                      '",' + display
                  )

                  final_auto.append((info, entry[1]))

              final_auto = unique(final_auto)
              final_entries = unique(manual + final_auto)

              write_m3u(AUTO, final_auto)
              write_m3u(MANUAL, manual)
              write_m3u(MAIN, final_entries)

              STATE.write_text(
                  json.dumps(
                      new_state, ensure_ascii=False, indent=2
                  ),
                  encoding="utf-8"
              )

              elapsed = round(time.time() - start, 1)

              report = [
                  "TURGUT IPTV TURKEY ULTIMATE RAPORU",
                  "===================================",
                  "Çalışma süresi: " + str(elapsed) + " saniye",
                  "Manuel kayıt: " + str(len(manual)),
                  "Otomatik kayıt: " + str(len(final_auto)),
                  "Toplam kayıt: " + str(len(final_entries)),
                  "Başarılı kontrol: " + str(good_count),
                  "Geçici korunan kayıt: " + str(stale_count),
                  "Başarısız kontrol: " + str(rejected_count),
                  "",
                  "NOTLAR:",
                  "- 401/403 yayınları otomatik listede tutulmaz.",
                  "- Geçici bağlantı hatalarında eski kayıtlar sınırlı korunabilir.",
                  "- Radyo yayınları Türkiye Radyo kategorisine alınır.",
                  "- GitHub kontrolü Peru'dan erişim garantisi vermez.",
                  "- Televizo alternatifleri ayrı kanal kaydı olarak gösterebilir.",
                  "- Resmî sayfa taraması dinamik JavaScript yayınlarını bulamayabilir.",
                  "- DRM, oturum veya erişim kısıtlamaları aşılmaz.",
                  "",
                  "HATA KAYITLARI:"
              ]

              report.extend(failed_log[:250])
              REPORT.write_text(
                  "\n".join(report) + "\n",
                  encoding="utf-8"
              )

              print("\n".join(report))
              print("Güncelleme tamamlandı.")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Commit playlists and report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Hourly Turkish IPTV and radio update"
          file_pattern: |
            Turgut.m3u
            Turgut_auto.m3u
            manual.m3u
            yedek-445.m3u
            stream_state.json
            Turgut_report.txt
