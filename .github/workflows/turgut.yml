
name: Turgut IPTV Smart Auto-Healer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv-auto-healer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests

      - name: IPTV botunu çalıştır
        run: python updater.py

      - name: Güncellenen dosyaları kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turgut IPTV hourly auto-healer"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json"
