
name: Turgut IPTV Smart Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereken paketleri kur
        run: pip install requests

      - name: IPTV listesini güncelle
        run: |
          python - <<'PY'
          import requests
          import json
          import re
          import time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          PLAYLIST = Path("Turgut.m3u")
          AUTO_FILE = Path("Turgut_auto.m3u")
          MANUAL_FILE = Path("manual.m3u")
          STATE_FILE = Path("stream_state.json")

          BACKUP_FILES = [
              Path("445.m3u"),
              Path("yedek-445.m3u")
          ]

          MAX_AUTO_CHANNELS = 900
          MAX_ALTERNATIVES = 3
          FAIL_LIMIT = 4
          TIMEOUT = 12
          WORKERS = 35

          HEADERS = {
              "User-Agent": "VLC/3.0.20",
              "Range": "bytes=0-0"
          }

          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
          ]

          def parse_m3u_text(text):
              entries = []
              info = None

              for line in text.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF"):
                      info = line

                  elif line.startswith("http://") or line.startswith("https://"):
                      if info:
                          entries.append((info, line))
                          info = None

              return entries

          def parse_file(path):
              if not path.exists():
                  return []

              try:
                  return parse_m3u_text(
                      path.read_text(encoding="utf-8", errors="ignore")
                  )
              except Exception as e:
                  print("Dosya okunamadı:", path, e)
                  return []

          def unique(entries):
              result = []
              seen = set()

              for info, url in entries:
                  url = url.strip()

                  if not url.startswith(("http://", "https://")):
                      continue

                  if url in seen:
                      continue

                  seen.add(url)
                  result.append((info, url))

              return result

          def name_of(entry):
              info = entry[0]
              match = re.search(r",(.+)$", info)

              if match:
                  return match.group(1).strip()

              return "Bilinmeyen kanal"

          def channel_key(entry):
              name = name_of(entry).lower()
              name = re.sub(r"\([^)]*\)", "", name)
              name = re.sub(r"\b(hd|fhd|uhd|4k|sd)\b", "", name)
              name = re.sub(r"[^a-z0-9çğıöşü]+", "", name)
              return name.strip()

          def check_stream(entry):
              url = entry[1]

              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=(8, TIMEOUT),
                      stream=True,
                      allow_redirects=True
                  )

                  status = response.status_code
                  response.close()

                  if 200 <= status < 400:
                      return "ok"

                  if status in (404, 410):
                      return "bad"

                  if status in (400, 401, 403, 408, 425, 429, 451):
                      return "temporary"

                  if status >= 500:
                      return "temporary"

                  return "bad"

              except requests.RequestException:
                  return "bad"

              except Exception:
                  return "bad"

          def download_source(url):
              try:
                  response = requests.get(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=25
                  )

                  if response.status_code == 200:
                      return parse_m3u_text(response.text)

              except Exception as e:
                  print("Kaynak alınamadı:", url, e)

              return []

          def read_state():
              if not STATE_FILE.exists():
                  return {}

              try:
                  return json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]

              for info, url in entries:
                  lines.append(info)
                  lines.append(url)

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def main():
              print("Turgut IPTV güncellemesi başladı.")

              current = parse_file(PLAYLIST)
              previous_auto = parse_file(AUTO_FILE)
              dedicated_manual = parse_file(MANUAL_FILE)

              backup_entries = []

              for backup in BACKUP_FILES:
                  if backup.exists():
                      found = parse_file(backup)
                      print(backup.name, "kanal sayısı:", len(found))
                      backup_entries.extend(found)

              # Önceki otomatik liste dışında kalanlar elle eklenmiş olabilir.
              old_auto_urls = {url for _, url in previous_auto}

              manual_entries = [
                  entry for entry in current
                  if entry[1] not in old_auto_urls
              ]

              manual_entries = unique(
                  dedicated_manual + manual_entries
              )

              fetched = []

              for source in SOURCES:
                  entries = download_source(source)
                  print("Kaynak:", source, "kanal:", len(entries))
                  fetched.extend(entries)

              auto_candidates = unique(
                  fetched + backup_entries + previous_auto
              )

              # Aynı isimde en fazla üç yayın alternatifi tut.
              grouped = {}
              for entry in auto_candidates:
                  key = channel_key(entry)

                  if not key:
                      key = entry[1]

                  grouped.setdefault(key, []).append(entry)

              limited = []

              for key, entries in grouped.items():
                  limited.extend(entries[:MAX_ALTERNATIVES])

              limited = limited[:MAX_AUTO_CHANNELS]

              state = read_state()
              new_state = {}
              working = []
              removed = 0
              temporary = 0

              print("Kontrol edilecek otomatik yayın:", len(limited))

              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  futures = {
                      pool.submit(check_stream, entry): entry
                      for entry in limited
                  }

                  for future in as_completed(futures):
                      entry = futures[future]
                      url = entry[1]
                      old = state.get(url, {})

                      try:
                          result = future.result()
                      except Exception:
                          result = "bad"

                      fail_count = int(old.get("fail_count", 0))

                      if result == "ok":
                          new_state[url] = {
                              "fail_count": 0,
                              "last_success": datetime.now(
                                  timezone.utc
                              ).isoformat()
                          }

                          working.append(entry)

                      elif result == "temporary":
                          temporary += 1

                          new_state[url] = {
                              "fail_count": fail_count,
                              "last_success": old.get("last_success")
                          }

                          # Geçici hata alan yayını koru.
                          working.append(entry)

                      else:
                          fail_count += 1

                          new_state[url] = {
                              "fail_count": fail_count,
                              "last_success": old.get("last_success")
                          }

                          if fail_count >= FAIL_LIMIT:
                              removed += 1
                              print(
                                  "4 başarısız kontrol sonrası çıkarıldı:",
                                  name_of(entry)
                              )
                          else:
                              working.append(entry)

              # Aynı kanalın alternatiflerini yan yana tut.
              working = unique(working)

              # Elle eklenen kanallar otomatik kontrolden silinmez.
              final_entries = unique(manual_entries + working)

              write_m3u(AUTO_FILE, working)
              write_m3u(MANUAL_FILE, manual_entries)
              write_m3u(PLAYLIST, final_entries)

              STATE_FILE.write_text(
                  json.dumps(
                      new_state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("--------------------------------")
              print("Yedek kaynak kanal:", len(backup_entries))
              print("Çalışan otomatik yayın:", len(working))
              print("Elle korunan yayın:", len(manual_entries))
              print("Geçici hata:", temporary)
              print("Dört kontrolde çıkarılan:", removed)
              print("Toplam son liste:", len(final_entries))
              print("Güncelleme tamamlandı.")

          if __name__ == "__main__":
              main()
          PY

      - name: Güncellenen listeyi kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turgut IPTV otomatik güncelleme"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json"
