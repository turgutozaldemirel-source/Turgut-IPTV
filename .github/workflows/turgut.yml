
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Update IPTV
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > updater.py <<'PY'
          import re
          import json
          import time
          import html
          import hashlib
          import unicodedata
          import requests
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor
          from bs4 import BeautifulSoup

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          BACKUP = Path("yedek-445.m3u")
          STATE = Path("stream_state.json")
          REPORT = Path("Turgut_report.txt")

          TIMEOUT = (8, 15)
          WORKERS = 16
          FAIL_LIMIT = 4
          MAX_SOURCE_ITEMS = 10000

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36",
              "Accept": "*/*"
          }

          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/languages/tur.m3u",
              "https://streams.uzunmuhalefet.com/lists/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u"
          ]

          OFFICIAL_SITES = {
              "ATV": "https://www.atv.com.tr/canli-yayin",
              "A2": "https://www.a2tv.com.tr/canli-yayin",
              "Show TV": "https://www.showtv.com.tr/canli-yayin",
              "Kanal D": "https://www.kanald.com.tr/canli-yayin",
              "Star TV": "https://www.startv.com.tr/canli-yayin",
              "NOW": "https://www.nowtv.com.tr/canli-yayin",
              "TV8": "https://www.tv8.com.tr/canli-yayin",
              "TRT 1": "https://www.trt1.com.tr/canli-izle",
              "TRT Haber": "https://www.trthaber.com/canli-yayin-izle.html",
              "TRT Spor": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Spor Yıldız": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Çocuk": "https://www.trtcocuk.net.tr/",
              "TRT Belgesel": "https://www.trtbelgesel.com.tr/",
              "A Haber": "https://www.ahaber.com.tr/canli-yayin",
              "A Spor": "https://www.aspor.com.tr/webtv/canli-yayin",
              "NTV": "https://www.ntv.com.tr/canli-yayin",
              "CNN Türk": "https://www.cnnturk.com/canli-yayin",
              "Haber Global": "https://haberglobal.com.tr/canli-yayin",
              "Habertürk": "https://www.haberturk.com/canliyayin",
              "TV100": "https://www.tv100.com/canli-yayin",
              "Halk TV": "https://halktv.com.tr/canli-yayin",
              "Sözcü TV": "https://www.sozcu.com.tr/tv/",
              "Kanal 7": "https://www.kanal7.com/canli-izle",
              "Beyaz TV": "https://www.beyaztv.com.tr/canli-yayin",
              "360": "https://www.tv360.com.tr/canli-yayin",
              "teve2": "https://www.teve2.com.tr/canli-yayin",
              "Bloomberg HT": "https://www.bloomberght.com/tv",
              "Diyanet TV": "https://www.diyanet.tv/",
              "Kral TV": "https://www.kralmuzik.com.tr/",
              "PowerTürk": "https://www.powerturk.com/"
          }

          CHANNELS = [
              "atv", "a2", "show tv", "kanal d", "star tv",
              "now", "tv8", "tv8,5", "trt 1", "trt 2",
              "trt haber", "trt spor", "trt spor yıldız",
              "trt çocuk", "trt belgesel", "trt müzik",
              "trt türk", "a haber", "a spor", "ntv",
              "cnn türk", "haber global", "habertürk",
              "tv100", "halk tv", "sözcü tv", "tele1",
              "tvnet", "beyaz tv", "kanal 7", "360",
              "teve2", "bloomberg ht", "ekotürk",
              "tgrt haber", "ülke tv", "ulusal kanal",
              "bengütürk", "flash haber", "kral tv",
              "kral pop", "powertürk", "dream türk",
              "number one türk", "slow türk", "minika çocuk",
              "minika go", "cartoon network", "kanal b",
              "tv5", "diyanet tv", "bi kanal", "sıfır tv",
              "fanatik tv", "sportstv", "sports tv",
              "trt avaz", "trt world", "trt arabi",
              "trt kurdi", "trt okul", "trt eba",
              "minika", "cartoonito", "disney channel",
              "nickelodeon", "power tv", "power dance",
              "power love", "nr1", "nr1 türk", "nr1 tv",
              "beinsports haber", "bein sports haber",
              "beinsports 1", "beinsports 2",
              "beinsports 3", "beinsports 4", "beinsports 5",
              "tabii spor", "tabii spor 1", "tabii spor 2"
          ]

          FOREIGN_BLOCK = [
              "aljazeera", "mbc", "rotana", "dubai",
              "arabic", "iraq", "iran", "syria", "egypt",
              "saudi", "kuwait", "qatar", "oman", "bahrain",
              "yemen", "jordan", "lebanon", "morocco",
              "algeria", "tunisia", "libya", "pakistan",
              "india", "bangladesh", "germany", "france",
              "italy", "spain", "portugal", "england",
              "united kingdom", "usa", "america", "canada",
              "brazil", "mexico", "peru", "argentina",
              "chile", "colombia", "ecuador", "bolivia"
          ]

          ALIASES = {
              "atvhd": "atv",
              "atvturkiye": "atv",
              "a2tv": "a2",
              "a2hd": "a2",
              "showtvhd": "showtv",
              "kanaldhd": "kanald",
              "startvhd": "startv",
              "nowtv": "now",
              "nowturkiye": "now",
              "tv8hd": "tv8",
              "trt1hd": "trt1",
              "trthaberhd": "trthaber",
              "trtsporhd": "trtspor",
              "asporhd": "aspor"
          }

          RADIO_WORDS = [
              "radyo", "radio", "fm", "am", "slowturk",
              "joyturk", "kralfm", "powerturk", "fenomen",
              "metro fm", "virgin radio", "power fm"
          ]

          # ATV'de SADECE bu üç dizi taranır.
          ATV_SHOWS = [
              "Avrupa Yakası",
              "Çocuklar Duymasın",
              "Altı Üstü İstanbul"
          ]

          # Star TV dizi arşivi ve güncel katalog hedefleri.
          STAR_SHOWS = [
              "Sevdiğim Sensin",
              "Çirkin",
              "Tuzlu Kahve",
              "Başkalarının Hayatı",
              "Yalı Çapkını",
              "Ömer",
              "Sefirin Kızı",
              "Kiralık Aşk",
              "Medcezir",
              "Paramparça",
              "İstanbullu Gelin",
              "Ufak Tefek Cinayetler",
              "Kardeş Çocukları",
              "Gecenin Ucunda",
              "Duy Beni"
          ]

          KANALD_SHOWS = [
              "Uzak Şehir",
              "Güller ve Günahlar",
              "Arka Sokaklar",
              "Daha 17"
          ]

          CATALOGS = {
              "ATV": ("https://www.atv.com.tr/diziler", ATV_SHOWS),
              "Star TV": ("https://www.startv.com.tr/diziler", STAR_SHOWS),
              "Kanal D": ("https://www.kanald.com.tr/diziler", KANALD_SHOWS)
          }

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = value.encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]", "", value)

          def clean_name(name):
              name = html.unescape(str(name))
              name = re.sub(r"\([^)]*\)|\[[^]]*\]", " ", name)
              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|hevc|4k|1080p|720p)\b",
                  " ", name, flags=re.I
              )
              return re.sub(r"\s+", " ", name).strip()

          def get_name(info):
              match = re.search(r",(.+)$", info)
              return match.group(1).strip() if match else "Bilinmeyen"

          def base_name(entry):
              info = entry[0]
              match = re.search(r'tvg-name="([^"]+)"', info, re.I)
              if match and match.group(1).strip():
                  return clean_name(match.group(1))
              return get_name(info)

          def channel_key(entry):
              info = entry[0]
              match = re.search(r'tvg-id="([^"]+)"', info, re.I)
              if match:
                  raw = re.sub(r"@.*$", "", match.group(1))
                  raw = re.sub(r"\.[A-Za-z]{2}$", "", raw)
              else:
                  raw = clean_name(base_name(entry))
              key = norm(raw)
              return ALIASES.get(key, key)

          def is_radio(entry):
              name = norm(base_name(entry))
              url = entry[1].lower()
              info = entry[0].lower()
              if any(norm(x) in name for x in RADIO_WORDS):
                  return True
              if any(x in url for x in [".mp3", ".aac", ".ogg", ".opus"]):
                  return True
              return "radio" in info or "radyo" in info

          def category(entry):
              if 'group-title="Türk Dizileri"' in entry[0]:
                  return "Türk Dizileri"
              n = channel_key(entry)
              name = norm(base_name(entry))
              if is_radio(entry):
                  return "Türkiye Radyo"
              if any(x in n or x in name for x in [
                  "trtspor", "aspor", "htspor", "ssport",
                  "tivibuspor", "sportstv", "fanatiktv",
                  "sifirtv", "bikanal", "beinsports",
                  "eurosport", "espn", "tabiispor"
              ]):
                  return "Türkiye Spor"
              if any(x in n or x in name for x in [
                  "ntv", "cnnturk", "ahaber", "haberturk",
                  "haberglobal", "tv100", "halktv",
                  "sozcutv", "tele1", "trthaber",
                  "ulusal", "benguturk", "flashhaber",
                  "ekoturk", "tvnet", "tgrthaber"
              ]):
                  return "Türkiye Haber"
              if any(x in n or x in name for x in [
                  "trtcocuk", "minika", "cartoon",
                  "nickelodeon", "disney", "cartoonito",
                  "trteba"
              ]):
                  return "Türkiye Çocuk"
              if any(x in n or x in name for x in [
                  "kral", "powerturk", "dreamturk",
                  "numberone", "slowturk", "powerlove",
                  "powerdance", "nr1"
              ]):
                  return "Türkiye Müzik"
              if any(x in n or x in name for x in [
                  "belgesel", "documentary", "diyanet"
              ]):
                  return "Türkiye Belgesel"
              return "Türkiye Ulusal"

          def parse_m3u(text):
              result = []
              info = None
              for line in (text or "").splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF"):
                      info = line
                  elif line.startswith(("http://", "https://")) and info:
                      result.append((info, line))
                      info = None
              return result

          def read_m3u(path):
              if not path.exists():
                  return []
              try:
                  return parse_m3u(
                      path.read_text(encoding="utf-8", errors="ignore")
                  )
              except Exception as exc:
                  print("Dosya okuma hatası:", path, exc)
                  return []

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]
              for info, url in entries:
                  lines.extend([info, url])
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def fetch_text(url):
              try:
                  response = requests.get(
                      url, headers=HEADERS, timeout=TIMEOUT
                  )
                  if response.status_code != 200:
                      print("Kaynak HTTP", response.status_code, url)
                      return ""
                  return response.text
              except Exception as exc:
                  print("Kaynak hatası:", url, exc)
                  return ""

          def is_turkish(entry):
              info = entry[0].lower()
              name = norm(base_name(entry))
              if any(norm(x) in name for x in FOREIGN_BLOCK):
                  return False
              if 'tvg-country="tr"' in info:
                  return True
              if 'country="turkey"' in info:
                  return True
              return any(norm(x) in name for x in CHANNELS)

          def allowed_channel(entry):
              name = norm(base_name(entry))
              key = channel_key(entry)
              return (
                  is_turkish(entry)
                  or any(norm(x) in name for x in CHANNELS)
                  or any(norm(x) in key for x in CHANNELS)
              )

          def direct_media_urls(text, base_url):
              found = set()
              patterns = [
                  r'https?:\\?/\\?/[^"\'\s<>]+?\.m3u8(?:\?[^"\'\s<>]*)?',
                  r'https?:\\?/\\?/[^"\'\s<>]+?\.mp4(?:\?[^"\'\s<>]*)?',
                  r'https?://[^"\'\s<>]+?\.m3u8(?:\?[^"\'\s<>]*)?',
                  r'https?://[^"\'\s<>]+?\.mp4(?:\?[^"\'\s<>]*)?'
              ]
              for pattern in patterns:
                  for raw in re.findall(pattern, text or "", re.I):
                      raw = raw.replace("\\/", "/").replace("\\u0026", "&")
                      raw = html.unescape(raw).rstrip(");,")
                      if raw.startswith("http"):
                          found.add(raw)

              for raw in re.findall(
                  r'''(?:src|file|source)\s*[:=]\s*["']([^"']+)["']''',
                  text or "", re.I
              ):
                  raw = html.unescape(raw).replace("\\/", "/")
                  absolute = urljoin(base_url, raw)
                  if re.search(r"\.(m3u8|mp4)(\?|$)", absolute, re.I):
                      found.add(absolute)

              return sorted(found)

          def stream_ok(url):
              try:
                  response = requests.get(
                      url, headers=HEADERS, timeout=TIMEOUT,
                      stream=True, allow_redirects=True
                  )
                  ok = response.status_code == 200
                  response.close()
                  return ok
              except Exception:
                  return False

          def check_entries(entries):
              unique = {}
              for entry in entries:
                  if len(unique) >= MAX_SOURCE_ITEMS:
                      break
                  if entry[1].startswith(("http://", "https://")):
                      unique.setdefault(entry[1], entry)

              items = list(unique.values())
              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  results = list(pool.map(
                      lambda e: stream_ok(e[1]), items
                  ))
              return [
                  entry for entry, ok in zip(items, results) if ok
              ]

          def scan_live_pages():
              results = []
              for channel, page in OFFICIAL_SITES.items():
                  print("Canlı sayfa taranıyor:", channel)
                  source = fetch_text(page)
                  if not source:
                      continue
                  for url in direct_media_urls(source, page)[:5]:
                      info = (
                          f'#EXTINF:-1 tvg-name="{channel}" '
                          f'group-title="Türkiye Ulusal",{channel}'
                      )
                      results.append((info, url))
              return results

          def provider_host(provider, url):
              host = urlparse(url).netloc.lower().split(":")[0]
              domains = {
                  "ATV": ("atv.com.tr",),
                  "Star TV": ("startv.com.tr",),
                  "Kanal D": ("kanald.com.tr",)
              }
              return any(
                  host == domain or host.endswith("." + domain)
                  for domain in domains[provider]
              )

          def fetch_page(url):
              source = fetch_text(url)
              if not source:
                  return None, ""
              return BeautifulSoup(source, "html.parser"), source

          def discover_series(provider, catalog, titles):
              soup, source = fetch_page(catalog)
              if not soup:
                  return {}

              found = {}
              targets = {norm(title): title for title in titles}

              for a in soup.find_all("a", href=True):
                  title = clean_name(a.get_text(" ", strip=True))
                  href = urljoin(catalog, a["href"])
                  if not provider_host(provider, href):
                      continue

                  combined = norm(title + " " + href)
                  for key, official_title in targets.items():
                      if key and key in combined:
                          found[official_title] = href
                          break

              return found

          def scan_series_page(provider, title, page_url):
              if not provider_host(provider, page_url):
                  return []

              print("Dizi taranıyor:", provider, title)
              soup, source = fetch_page(page_url)
              if not soup:
                  return []

              pages = {page_url}
              for a in soup.find_all("a", href=True):
                  href = urljoin(page_url, a["href"])
                  if not provider_host(provider, href):
                      continue
                  path = urlparse(href).path.lower()
                  if any(word in path for word in [
                      "fragman", "haber", "galeri", "foto",
                      "oyuncular", "kadro", "tanitim"
                  ]):
                      continue
                  pages.add(href)

              results = []
              seen = set()

              for page in list(pages)[:35]:
                  if re.search(r"\.(m3u8|mp4)(\?|$)", page, re.I):
                      media_urls = [page]
                  else:
                      _, page_source = fetch_page(page)
                      media_urls = direct_media_urls(page_source, page)

                  for media in media_urls:
                      if media in seen:
                          continue
                      seen.add(media)
                      info = (
                          f'#EXTINF:-1 tvg-id="{norm(title)}" '
                          f'tvg-name="{title}" '
                          f'group-title="Türk Dizileri",'
                          f'{title} - {provider}'
                      )
                      results.append((info, media))
                      if len(results) >= 8:
                          break
                  if len(results) >= 8:
                      break

              return results

          def scan_all_series():
              results = []
              report = []

              for provider, config in CATALOGS.items():
                  catalog, titles = config
                  print("Dizi kataloğu:", provider)
                  found = discover_series(provider, catalog, titles)
                  report.append(
                      f"{provider}: katalogda bulunan hedef dizi: {len(found)}"
                  )

                  for title, url in found.items():
                      episodes = scan_series_page(provider, title, url)
                      results.extend(episodes)
                      report.append(
                          f"{title}: {len(episodes)} doğrudan medya bağlantısı"
                      )

                  missing = [
                      title for title in titles if title not in found
                  ]
                  if missing:
                      report.append(
                          "Katalogda bulunamayan hedefler: " +
                          ", ".join(missing)
                      )

              return results, report

          def entry_id(entry):
              return hashlib.sha1(entry[1].encode()).hexdigest()

          def deduplicate(entries):
              result = []
              seen = set()
              for entry in entries:
                  if entry[1] not in seen:
                      seen.add(entry[1])
                      result.append(entry)
              return result

          def main():
              print("Turgut IPTV güncellemesi başladı.")

              try:
                  state = json.loads(
                      STATE.read_text(encoding="utf-8")
                  ) if STATE.exists() else {}
              except Exception:
                  state = {}

              source_entries = []
              source_report = []

              for source in SOURCES:
                  print("M3U kaynağı:", source)
                  text = fetch_text(source)
                  entries = parse_m3u(text)
                  source_report.append(
                      f"{source}: {len(entries)} kayıt"
                  )
                  source_entries.extend(entries)

              source_entries = [
                  entry for entry in source_entries
                  if allowed_channel(entry)
              ]

              live_entries = scan_live_pages()
              series_entries, series_report = scan_all_series()

              manual_entries = read_m3u(MANUAL)
              old_auto = read_m3u(AUTO)

              candidates = deduplicate(
                  source_entries + live_entries + series_entries
              )

              print("Toplam aday bağlantı:", len(candidates))
              checked = check_entries(candidates)
              print("Kontrolden geçen:", len(checked))

              current_urls = {entry[1] for entry in checked}
              retained = []

              for entry in old_auto:
                  if entry[1] in current_urls:
                      continue
                  key = entry_id(entry)
                  failures = state.get(key, 0) + 1
                  if failures < FAIL_LIMIT:
                      retained.append(entry)
                  state[key] = failures

              for entry in checked:
                  state[entry_id(entry)] = 0

              auto_entries = deduplicate(checked + retained)
              final_entries = deduplicate(
                  manual_entries + auto_entries
              )

              if MAIN.exists():
                  previous = read_m3u(MAIN)
                  if previous:
                      write_m3u(BACKUP, previous)

              write_m3u(AUTO, auto_entries)
              write_m3u(MAIN, final_entries)

              STATE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              report = [
                  "TURGUT IPTV RAPORU",
                  time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "",
                  f"Kaynaklardan alınan: {len(source_entries)}",
                  f"Resmî canlı sayfalardan bulunan: {len(live_entries)}",
                  f"Dizi bağlantısı adayı: {len(series_entries)}",
                  f"Kontrolden geçen otomatik kayıt: {len(auto_entries)}",
                  f"Manuel kayıt: {len(manual_entries)}",
                  f"Toplam ana liste: {len(final_entries)}",
                  "",
                  "ATV hedefleri:",
                  *[f"- {x}" for x in ATV_SHOWS],
                  "",
                  "Star TV hedefleri:",
                  *[f"- {x}" for x in STAR_SHOWS],
                  "",
                  "Kanal D hedefleri:",
                  *[f"- {x}" for x in KANALD_SHOWS],
                  "",
                  "DİZİ TARAMA RAPORU:",
                  *series_report,
                  "",
                  "KAYNAK RAPORU:",
                  *source_report
              ]

              REPORT.write_text(
                  "\n".join(report) + "\n",
                  encoding="utf-8"
              )

              print("\n".join(report))
              print("Güncelleme tamamlandı.")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turgut IPTV otomatik güncelleme"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u yedek-445.m3u stream_state.json Turgut_report.txt"
