
name: Turgut Turkey and World Sports IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: turgut-turkey-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, organize and check channels
        run: |
          python - <<'PY'
          import re
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TURKEY_URL = "https://iptv-org.github.io/iptv/countries/tr.m3u"
          SPORTS_URL = "https://iptv-org.github.io/iptv/categories/sports.m3u"

          PLAYLIST = Path("Turgut.m3u")
          AUTO_FILE = Path("Turgut_auto.m3u")
          FAIL_FILE = Path("manual_failures.json")

          MAX_FAILURES = 4
          TIMEOUT = 12

          GROUP_ORDER = [
              "Türkiye Ulusal",
              "Haber",
              "Spor",
              "Dünya Spor",
              "Müzik",
              "Dizi ve Eğlence",
              "Sinema",
              "Çocuk ve Çizgi Film",
              "Belgesel",
              "Ekonomi",
              "Dinî",
              "Yerel TV",
              "Kültür ve Eğitim",
              "Diğer"
          ]

          RULES = {
              "Haber": [
                  "haber", "news", "tele 1", "habertürk",
                  "ntv", "cnn türk", "tvnet", "tgrt haber",
                  "bloomberg", "halk tv", "sözcü"
              ],
              "Müzik": [
                  "müzik", "muzik", "music", "power",
                  "kral pop", "kral tv", "dream türk",
                  "nr1", "number one", "slow türk"
              ],
              "Çocuk ve Çizgi Film": [
                  "çocuk", "cocuk", "cartoon", "nick",
                  "disney junior", "baby tv", "minika",
                  "rafadan", "pırıl", "cizgi"
              ],
              "Sinema": [
                  "sinema", "cinema", "movie", "film",
                  "action", "premium cinema"
              ],
              "Belgesel": [
                  "belgesel", "documentary", "discovery",
                  "nat geo", "national geographic",
                  "animal planet", "history"
              ],
              "Ekonomi": [
                  "ekonomi", "finans", "business",
                  "borsa", "ekotürk"
              ],
              "Dinî": [
                  "diyanet", "dini", "dinî", "kuran",
                  "kur'an", "mekke", "medine"
              ],
              "Yerel TV": [
                  "yerel", "belediye", "kent tv"
              ],
              "Kültür ve Eğitim": [
                  "eğitim", "egitim", "üniversite",
                  "universite", "kültür", "kultur"
              ],
              "Dizi ve Eğlence": [
                  "dizi", "eğlence", "eglence",
                  "komedi", "magazin"
              ]
          }

          NATIONAL = [
              "trt 1", "trt 2", "trt avaz", "trt türk",
              "trt turk", "atv", "kanal d", "show tv",
              "star tv", "now", "fox", "tv8", "kanal 7",
              "beyaz tv", "teve2", "360", "a2", "tv4"
          ]

          TURKISH_SPORTS = [
              "trt spor", "a spor", "aspor",
              "tivibu spor", "tabii spor",
              "beinsports tr", "bein sports tr"
          ]

          SPORTS_WORDS = [
              "sport", "sports", "spor", "espn",
              "eurosport", "bein", "sky sport",
              "fox sports", "dazn", "supersport",
              "sport tv", "canal+ sport", "canal plus sport",
              "tennis", "golf", "racing", "motorsport",
              "formula", "f1", "football", "soccer",
              "basketball", "cricket", "fight", "ufc",
              "wwe", "hockey", "rugby", "volleyball"
          ]

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8-sig")

          def parse_entries(text):
              entries = []
              current = []

              for line in text.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      if current:
                          entries.append(current)
                      current = [line]
                  elif current and line:
                      current.append(line)

              if current:
                  entries.append(current)

              return [
                  entry for entry in entries
                  if any(
                      x.startswith(("http://", "https://"))
                      for x in entry
                  )
              ]

          def get_url(entry):
              for line in entry:
                  if line.startswith(("http://", "https://")):
                      return line.strip()
              return None

          def get_name(info):
              if "," in info:
                  return info.split(",", 1)[1].strip()
              return "İsimsiz Kanal"

          def get_group(name, world_sports=False):
              value = name.casefold()
              normalized = re.sub(r"\s+", " ", value).strip()

              if world_sports:
                  return "Dünya Spor"

              if any(
                  normalized == n or normalized.startswith(n + " ")
                  for n in NATIONAL
              ):
                  return "Türkiye Ulusal"

              for group, words in RULES.items():
                  if any(word in value for word in words):
                      return group

              if any(word in value for word in TURKISH_SPORTS):
                  return "Spor"

              if any(word in value for word in SPORTS_WORDS):
                  return "Dünya Spor"

              return "Diğer"

          def set_group(entry, world_sports=False):
              entry = list(entry)
              info = entry[0]
              name = get_name(info)
              group = get_group(name, world_sports)

              if re.search(r'group-title="[^"]*"', info, re.I):
                  info = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.I
                  )
              else:
                  comma = info.find(",")
                  if comma >= 0:
                      info = (
                          info[:comma]
                          + f' group-title="{group}"'
                          + info[comma:]
                      )

              entry[0] = info
              return entry, group, name

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]
              for entry in entries:
                  lines.extend(entry)
              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def check_stream(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Range": "bytes=0-2047"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=TIMEOUT
                  ) as response:
                      response.read(1024)
                      return 200 <= response.status < 400

              except urllib.error.HTTPError as error:
                  if error.code in (408, 425, 429, 500, 502, 503, 504):
                      return None
                  return False

              except Exception:
                  return False

          try:
              # İki resmi kaynağı indir.
              turkey_entries = parse_entries(download(TURKEY_URL))
              sports_entries = parse_entries(download(SPORTS_URL))

              if not turkey_entries:
                  raise RuntimeError("Türkiye kanal kaynağı boş.")

              if not sports_entries:
                  raise RuntimeError("Dünya spor kaynağı boş.")

              print("Türkiye kaynağı:", len(turkey_entries))
              print("Dünya spor kaynağı:", len(sports_entries))

              # Önceki otomatik listeyi oku.
              previous_auto = (
                  parse_entries(AUTO_FILE.read_text(encoding="utf-8"))
                  if AUTO_FILE.exists()
                  else []
              )

              previous_auto_urls = {
                  get_url(entry) for entry in previous_auto
              }

              # Mevcut ana listeyi oku.
              current_entries = (
                  parse_entries(PLAYLIST.read_text(encoding="utf-8"))
                  if PLAYLIST.exists()
                  else []
              )

              all_source_urls = {
                  get_url(entry)
                  for entry in turkey_entries + sports_entries
              }

              # Önceden otomatik listede olmayanlar manuel kabul edilir.
              if AUTO_FILE.exists():
                  manual_entries = [
                      entry for entry in current_entries
                      if get_url(entry) not in previous_auto_urls
                  ]
              else:
                  manual_entries = [
                      entry for entry in current_entries
                      if get_url(entry) not in all_source_urls
                  ]

              # Hata sayaçlarını yükle.
              failures = (
                  json.loads(FAIL_FILE.read_text(encoding="utf-8"))
                  if FAIL_FILE.exists()
                  else {}
              )

              # Otomatik Türkiye kanalları.
              auto_entries = []
              seen_urls = set()

              for entry in turkey_entries:
                  url = get_url(entry)
                  if not url or url in seen_urls:
                      continue

                  seen_urls.add(url)
                  organized, _, _ = set_group(entry)
                  auto_entries.append(organized)

              # Dünya spor kanalları.
              for entry in sports_entries:
                  url = get_url(entry)
                  if not url or url in seen_urls:
                      continue

                  seen_urls.add(url)
                  organized, _, _ = set_group(
                      entry, world_sports=True
                  )
                  auto_entries.append(organized)

              # Manuel kanalları tekilleştir.
              unique_manual = []
              manual_seen = set()

              for entry in manual_entries:
                  url = get_url(entry)

                  if not url or url in manual_seen or url in seen_urls:
                      continue

                  manual_seen.add(url)
                  unique_manual.append(entry)

              # Manuel yayınları kontrol et.
              results = {}

              with ThreadPoolExecutor(max_workers=20) as executor:
                  jobs = {
                      executor.submit(check_stream, get_url(entry)): entry
                      for entry in unique_manual
                  }

                  for future in as_completed(jobs):
                      entry = jobs[future]
                      url = get_url(entry)

                      try:
                          results[url] = future.result()
                      except Exception:
                          results[url] = False

              kept_manual = []
              removed = 0
              working = 0

              for entry in unique_manual:
                  url = get_url(entry)
                  result = results.get(url, False)

                  if result is True:
                      failures.pop(url, None)
                      kept_manual.append(entry)
                      working += 1

                  elif result is None:
                      kept_manual.append(entry)

                  else:
                      count = int(failures.get(url, 0)) + 1
                      failures[url] = count

                      print(
                          "Manuel yayın:",
                          get_name(entry[0]),
                          "Hata:",
                          count,
                          "/", MAX_FAILURES
                      )

                      if count >= MAX_FAILURES:
                          failures.pop(url, None)
                          removed += 1
                          print("4 başarısız kontrol: silindi")
                      else:
                          kept_manual.append(entry)

              # Manuel kanalları gruplandır.
              organized_manual = []

              for entry in kept_manual:
                  organized, _, _ = set_group(entry)
                  organized_manual.append(organized)

              def sort_key(entry):
                  _, group, name = set_group(entry)
                  return (
                      GROUP_ORDER.index(group),
                      name.casefold()
                  )

              auto_entries.sort(key=sort_key)
              organized_manual.sort(key=sort_key)

              combined = auto_entries + organized_manual
              combined.sort(key=sort_key)

              # Dosyaları kaydet.
              write_m3u(AUTO_FILE, auto_entries)
              write_m3u(PLAYLIST, combined)

              FAIL_FILE.write_text(
                  json.dumps(
                      failures,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("--------------------------------")
              print("Türkiye otomatik:", len(turkey_entries))
              print("Dünya spor kaynak:", len(sports_entries))
              print("Toplam otomatik:", len(auto_entries))
              print("Çalışan manuel:", working)
              print("Silinen manuel:", removed)
              print("Korunan manuel:", len(kept_manual))
              print("TOPLAM:", len(combined))
              print("Güncelleme tamamlandı.")

          except Exception as error:
              print("HATA:", error)
              raise
          PY

      - name: Save updated playlists
        run: |
          git config user.name "Turgut IPTV Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Turgut.m3u Turgut_auto.m3u manual_failures.json
          git diff --cached --quiet || git commit -m "Update Turkish and world sports IPTV"
          git push
