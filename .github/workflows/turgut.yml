
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereken paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: IPTV listelerini güncelle
        run: |
          cat > updater.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse

          MAIN = "Turgut.m3u"
          AUTO = "Turgut_auto.m3u"
          MANUAL = "manual.m3u"
          STATE = "stream_state.json"
          REPORT = "Turgut_report.txt"

          OUTPUTS = {
              "Türkiye": "turkiye.m3u",
              "Türk Spor": "turk-spor.m3u",
              "Latin Amerika Spor": "latin-amerika.m3u",
              "Dünya Spor": "world-sport.m3u",
              "Film-Dizi": "film-dizi.m3u",
              "Haber": "haber.m3u",
              "Müzik": "muzik.m3u",
              "Çocuk": "cocuk.m3u",
              "Radyo": "radyo.m3u",
              "Belgesel": "belgesel.m3u",
          }

          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/languages/tur.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/series.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u",
              "https://iptv-org.github.io/iptv/categories/radio.m3u",
              "https://iptv-org.github.io/iptv/categories/documentary.m3u",
          ]

          EXTRA_SOURCES = [
              "https://streams.uzunmuhalefet.com/",
              "https://raw.githubusercontent.com/nexonic/iptv/main/turkey.m3u",
          ]

          FAIL_LIMIT = 4
          TIMEOUT = 12
          MAX_WORKERS = 30

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; TurgutIPTVUpdater/1.0)"
          }

          TURKISH_CHANNELS = [
              "trt", "atv", "a2", "show tv", "kanal d", "star tv",
              "now", "fox", "tv8", "tv8.5", "kanal 7", "beyaz",
              "360", "teve2", "a haber", "a spor", "ntv", "cnn türk",
              "haber global", "habertürk", "tv100", "halk tv",
              "sözcü", "bloomberg ht", "diyanet", "kral tv",
              "powertürk", "kanal 24", "24 tv", "ulusal kanal",
              "tele1", "flash haber", "ekol tv", "kanal 26",
              "kanal 33", "kanal 34", "kanal 3", "kanal 7",
              "tgrt", "tgrt haber", "sports tv", "fb tv",
              "gs tv", "bursaspor tv", "beşiktaş",
              "tabii", "trt spor", "trt çocuk", "trt belgesel",
              "trt müzik", "trt haber", "trt 1", "trt 2",
              "trt avaz", "trt türk", "trt world"
          ]

          TURK_SPORT = [
              "trt spor", "a spor", "sports tv", "fb tv",
              "gs tv", "beşiktaş", "aspor", "tabii spor",
              "s sport", "sportstv", "bloomberg ht"
          ]

          WORLD_SPORT = [
              "espn", "fox sports", "sport", "sports",
              "eurosport", "sky sport", "tnt sports",
              "dazn", "fifa", "nba", "tennis", "golf",
              "motorsport", "racing", "fight", "boxing",
              "ufc", "football", "soccer", "bein"
          ]

          LATAM_COUNTRIES = [
              "argentina", "brazil", "brasil", "chile",
              "colombia", "peru", "uruguay", "ecuador",
              "paraguay", "bolivia", "venezuela",
              "mexico", "méxico", "latin", "latino"
          ]

          NEWS_WORDS = [
              "haber", "news", "ntv", "cnn", "a haber",
              "habertürk", "tv100", "halk tv", "sözcü",
              "tele1", "flash", "ulusal", "tgrt haber"
          ]

          MUSIC_WORDS = [
              "müzik", "music", "kral", "power", "dream türk",
              "number one", "slow", "radio"
          ]

          KIDS_WORDS = [
              "çocuk", "kids", "cartoon", "baby", "junior",
              "minika", "trt çocuk", "nick", "disney"
          ]

          MOVIE_WORDS = [
              "film", "movie", "cinema", "sinema", "dizi",
              "series", "show", "kanal d", "atv", "star tv",
              "teve2", "now", "tv8"
          ]

          RADIO_WORDS = ["radio", "radyo", "fm"]

          DOC_WORDS = [
              "belgesel", "documentary", "discovery",
              "history", "nature", "animal", "science"
          ]

          ATV_SHOWS = [
              "Avrupa Yakası",
              "Çocuklar Duymasın",
              "Altı Üstü İstanbul",
          ]

          STAR_SHOWS = [
              "Sevdiğim Sensin", "Çirkin", "Tuzlu Kahve",
              "Başkalarının Hayatı", "Yalı Çapkını", "Ömer",
              "Sefirin Kızı", "Kiralık Aşk", "Medcezir",
              "Paramparça", "İstanbullu Gelin",
              "Ufak Tefek Cinayetler", "Kardeş Çocukları",
              "Gecenin Ucunda", "Duy Beni",
          ]

          KANALD_SHOWS = [
              "Uzak Şehir", "Güller ve Günahlar",
              "Arka Sokaklar", "Daha 17",
          ]

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          def norm(value):
              value = str(value or "").lower()
              value = value.replace("ı", "i").replace("İ", "i")
              value = value.replace("ş", "s").replace("ğ", "g")
              value = value.replace("ü", "u").replace("ö", "o")
              value = value.replace("ç", "c")
              return re.sub(r"\s+", " ", value).strip()

          def url_hash(url):
              return hashlib.sha256(url.encode()).hexdigest()

          def read_state():
              if os.path.exists(STATE):
                  try:
                      with open(STATE, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {}

          def parse_m3u(text):
              entries = []
              info = None

              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue

                  if line.startswith("#EXTINF"):
                      info = line

                  elif line.startswith("http://") or line.startswith("https://"):
                      if info:
                          entries.append((info, line))
                          info = None

              return entries

          def read_m3u(path):
              if not os.path.exists(path):
                  return []

              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      return parse_m3u(f.read())
              except Exception:
                  return []

          def fetch_source(url):
              try:
                  response = SESSION.get(url, timeout=20)
                  if response.status_code == 200:
                      return parse_m3u(response.text)
              except Exception as e:
                  print("Kaynak alınamadı:", url, str(e))
              return []

          def fetch_all_sources():
              entries = []

              with ThreadPoolExecutor(max_workers=12) as pool:
                  futures = [pool.submit(fetch_source, u) for u in SOURCES + EXTRA_SOURCES]

                  for future in as_completed(futures):
                      try:
                          entries.extend(future.result())
                      except Exception:
                          pass

              return entries

          def channel_name(info):
              match = re.search(r'tvg-name="([^"]+)"', info)
              if match:
                  return match.group(1).strip()

              if "," in info:
                  return info.split(",", 1)[1].strip()

              return "Bilinmeyen Kanal"

          def group_name(info):
              match = re.search(r'group-title="([^"]*)"', info)
              return match.group(1).strip() if match else ""

          def set_group(info, group):
              if 'group-title="' in info:
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      count=1
                  )

              return info.replace("#EXTINF:-1", f'#EXTINF:-1 group-title="{group}"', 1)

          def category(info, url=""):
              name = norm(channel_name(info))
              group = norm(group_name(info))
              combined = name + " " + group + " " + norm(url)

              if any(x in combined for x in RADIO_WORDS):
                  return "Türkiye Radyo"

              if any(x in combined for x in DOC_WORDS):
                  return "Türkiye Belgesel"

              if any(x in combined for x in KIDS_WORDS):
                  return "Türkiye Çocuk"

              if any(x in combined for x in MUSIC_WORDS):
                  return "Türkiye Müzik"

              if any(x in combined for x in NEWS_WORDS):
                  return "Türkiye Haber"

              if any(x in combined for x in TURK_SPORT):
                  return "Türkiye Spor"

              if any(x in combined for x in MOVIE_WORDS):
                  return "Türk Dizileri"

              return "Türkiye Ulusal"

          def is_turkish(info, url=""):
              name = norm(channel_name(info))
              group = norm(group_name(info))
              combined = name + " " + group

              return any(norm(x) in combined for x in TURKISH_CHANNELS)

          def is_latin_sport(info, url=""):
              combined = norm(channel_name(info)) + " " + norm(group_name(info))
              return (
                  any(norm(x) in combined for x in LATAM_COUNTRIES)
                  and any(norm(x) in combined for x in WORLD_SPORT)
              )

          def is_world_sport(info, url=""):
              combined = norm(channel_name(info)) + " " + norm(group_name(info))
              return any(norm(x) in combined for x in WORLD_SPORT)

          def allowed_channel(info, url=""):
              return is_turkish(info, url) or is_world_sport(info, url) or is_latin_sport(info, url)

          def clean_url(url):
              return url.strip().replace("&amp;", "&")

          def check_stream(item):
              info, url = item
              url = clean_url(url)

              if not url.startswith(("http://", "https://")):
                  return item, False

              try:
                  response = SESSION.get(
                      url,
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True
                  )

                  good = response.status_code == 200
                  content_type = response.headers.get("Content-Type", "").lower()

                  if good and (
                      "text/html" in content_type
                      and not any(x in url.lower() for x in [".m3u8", ".ts", ".mp4"])
                  ):
                      good = False

                  response.close()
                  return (info, url), good

              except Exception:
                  return (info, url), False

          def check_entries(entries):
              results = []

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  futures = [pool.submit(check_stream, item) for item in entries]

                  for future in as_completed(futures):
                      try:
                          results.append(future.result())
                      except Exception:
                          pass

              return results

          def write_m3u(path, entries):
              with open(path, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  for info, url in entries:
                      f.write(info + "\n")
                      f.write(url + "\n")

          def classify_outputs(entries):
              result = {key: [] for key in OUTPUTS}

              for info, url in entries:
                  name = norm(channel_name(info))
                  group = norm(group_name(info))
                  combined = name + " " + group

                  if is_latin_sport(info, url):
                      result["Latin Amerika Spor"].append((set_group(info, "Latin Amerika Spor"), url))

                  elif is_world_sport(info, url):
                      result["Dünya Spor"].append((set_group(info, "Dünya Spor"), url))

                  elif any(norm(x) in combined for x in TURK_SPORT):
                      result["Türk Spor"].append((set_group(info, "Türk Spor"), url))

                  elif any(norm(x) in combined for x in NEWS_WORDS):
                      result["Haber"].append((set_group(info, "Türkiye Haber"), url))

                  elif any(norm(x) in combined for x in MUSIC_WORDS):
                      result["Müzik"].append((set_group(info, "Türkiye Müzik"), url))

                  elif any(norm(x) in combined for x in KIDS_WORDS):
                      result["Çocuk"].append((set_group(info, "Türkiye Çocuk"), url))

                  elif any(norm(x) in combined for x in RADIO_WORDS):
                      result["Radyo"].append((set_group(info, "Türkiye Radyo"), url))

                  elif any(norm(x) in combined for x in DOC_WORDS):
                      result["Belgesel"].append((set_group(info, "Türkiye Belgesel"), url))

                  elif any(norm(x) in combined for x in MOVIE_WORDS):
                      result["Film-Dizi"].append((set_group(info, "Türk Dizileri"), url))

                  elif is_turkish(info, url):
                      result["Türkiye"].append((set_group(info, "Türkiye Ulusal"), url))

              return result

          def main():
              print("Turgut IPTV güncelleme başladı.")

              state = read_state()
              old_auto = read_m3u(AUTO)
              manual = read_m3u(MANUAL)
              old_main = read_m3u(MAIN)

              # Önceki ana listede olup manuel dosyaya henüz taşınmamış
              # ve otomatik listede de bulunmayan girişleri koru.
              auto_urls = {url for _, url in old_auto}
              manual_urls = {url for _, url in manual}

              for info, url in old_main:
                  if url not in auto_urls and url not in manual_urls:
                      manual.append((info, url))
                      manual_urls.add(url)

              print("Kaynaklar taranıyor...")
              discovered = fetch_all_sources()

              discovered = [
                  (info, clean_url(url))
                  for info, url in discovered
                  if allowed_channel(info, url)
              ]

              # Aynı URL'yi tekilleştir.
              unique = {}
              for info, url in discovered:
                  if url not in unique:
                      unique[url] = (info, url)

              discovered = list(unique.values())

              print("Bulunan otomatik yayın:", len(discovered))

              checked = check_entries(discovered)
              working = [item for item, good in checked if good]

              current_urls = {url for _, url in working}
              failed_urls = {url for (info, url), good in checked if not good}

              # Eski otomatik yayınları dört başarısız kontrole kadar takip et.
              old_by_url = {url: info for info, url in old_auto}
              retained = []

              for info, url in old_auto:
                  if url in current_urls:
                      continue

                  key = url_hash(url)
                  previous = state.get(key, {})
                  failures = int(previous.get("failures", 0)) + 1

                  state[key] = {
                      "failures": failures,
                      "last_url": url
                  }

                  if failures < FAIL_LIMIT:
                      retained.append((info, url))
                  else:
                      print("Bozuk otomatik yayın kaldırıldı:", channel_name(info))

              # Yeni bulunan çalışan yayınları ekle.
              final_auto = []
              seen = set()

              for item in working + retained:
                  info, url = item
                  if url not in seen:
                      final_auto.append(item)
                      seen.add(url)

                  key = url_hash(url)
                  state[key] = {
                      "failures": 0,
                      "last_url": url
                  }

              # Manuel yayınları kontrol etmeden koru.
              final_manual = []
              manual_seen = set()

              for info, url in manual:
                  if url not in manual_seen:
                      final_manual.append((info, url))
                      manual_seen.add(url)

              # Manuel ve otomatik listeler birleştirilir.
              combined = []
              combined_seen = set()

              for item in final_manual + final_auto:
                  info, url = item
                  if url not in combined_seen:
                      combined.append(item)
                      combined_seen.add(url)

              # Ana liste ve otomatik liste.
              write_m3u(AUTO, final_auto)
              write_m3u(MAIN, combined)

              # Kategori dosyaları yalnızca birleşik listeden oluşturulur.
              categorized = classify_outputs(combined)

              for category_name, filename in OUTPUTS.items():
                  write_m3u(filename, categorized[category_name])

              # Durum dosyasını mevcut ve son dönemde takip edilen yayınlarla sınırla.
              keep_hashes = {
                  url_hash(url)
                  for _, url in final_auto
              }

              state = {
                  key: value
                  for key, value in state.items()
                  if key in keep_hashes
              }

              with open(STATE, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=2)

              report = [
                  "TURGUT IPTV GUNCELLEME RAPORU",
                  "-----------------------------",
                  f"Bulunan kaynak yayını: {len(discovered)}",
                  f"Çalışan otomatik yayın: {len(final_auto)}",
                  f"Manuel yayın: {len(final_manual)}",
                  f"Toplam ana liste: {len(combined)}",
                  "",
                  "KATEGORİLER:"
              ]

              for category_name, filename in OUTPUTS.items():
                  report.append(
                      f"{category_name}: {len(categorized[category_name])} ({filename})"
                  )

              with open(REPORT, "w", encoding="utf-8") as f:
                  f.write("\n".join(report) + "\n")

              print("\n".join(report))
              print("Güncelleme tamamlandı.")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json Turgut_report.txt
          git add turkiye.m3u turk-spor.m3u latin-amerika.m3u world-sport.m3u
          git add film-dizi.m3u haber.m3u muzik.m3u cocuk.m3u radyo.m3u belgesel.m3u

          git add -u yedek-445.m3u

          if ! git diff --cached --quiet; then
            git commit -m "IPTV listeleri otomatik güncellendi"
            git push
          else
            echo "Değişiklik yok."
          fi
