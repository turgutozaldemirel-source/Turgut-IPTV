
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Create updater
        run: |
          cat > updater.py <<'PY'
          import requests
          import re
          import json
          import unicodedata
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          BACKUP = Path("yedek-445.m3u")
          STATE = Path("stream_state.json")

          MAX_CHANNELS = 6000
          MAX_ALTERNATIVES = 5
          FAIL_LIMIT = 4
          WORKERS = 30
          TIMEOUT = 12

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*"
          }

          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/verified.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u",
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_turkey.m3u8"
          ]

          TURKISH_CHANNELS = [
              "atv", "a2", "show tv", "kanal d", "star tv",
              "now tv", "fox", "tv8", "tv8.5", "kanal 7",
              "beyaz tv", "teve2", "360", "trt 1", "trt 2",
              "trt belgesel", "trt çocuk", "trt spor",
              "trt haber", "trt müzik", "trt türk",
              "a spor", "ht spor", "tivibu spor", "s sport",
              "ntv", "cnn türk", "a haber", "habertürk",
              "haber global", "tv100", "sözcü tv", "halk tv",
              "tele1", "tvnet", "ulusal kanal", "bengütürk",
              "ekotürk", "bloomberg ht", "tgrt haber",
              "tgrt belgesel", "kral pop", "kral tv",
              "powertürk", "dream türk", "number one türk",
              "slow türk", "power pop", "minika", "minika go",
              "cartoon network türkiye", "cnbc e", "kanal b",
              "flash haber", "tvem", "kanal 3", "kanal 26",
              "kanal 33", "kon tv", "ostim tv", "meltem tv",
              "kanal urfa", "kanal 23", "line tv", "tv den",
              "ege tv", "kanal ege", "kanal v", "tv kayseri",
              "bursa tv", "konya tv", "ordu tv",
              "mavi karadeniz", "tv5", "kanal avrupa",
              "tgrt eu", "tv 5"
          ]

          FOREIGN_BLOCK = [
              "aljazeera", "mbc", "rotana", "dubaisports",
              "abudhabi", "alkass", "shahid", "osn",
              "arabic", "iraq", "iran", "syria", "egypt",
              "saudi", "kuwait", "qatar", "oman", "bahrain",
              "yemen", "jordan", "lebanon", "morocco",
              "algeria", "tunisia", "libya", "palestine",
              "pakistan", "india", "bangladesh", "afghanistan",
              "germany", "deutschland", "france", "italy",
              "spain", "portugal", "england", "unitedkingdom",
              "usa", "america", "canada", "brazil", "mexico",
              "peru", "argentina", "chile", "colombia",
              "ecuador", "bolivia", "venezuela", "uruguay",
              "paraguay"
          ]

          ALLOWED = {
              re.sub(r"[^a-z0-9]", "", unicodedata.normalize(
                  "NFKD", x
              ).encode("ascii", "ignore").decode().lower())
              for x in TURKISH_CHANNELS
          }

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = value.encode("ascii", "ignore").decode()
              return re.sub(r"[^a-z0-9]", "", value.lower())

          def parse_m3u(content):
              result = []
              info = None

              for line in content.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      info = line

                  elif line.startswith(("http://", "https://")) and info:
                      result.append((info, line))
                      info = None

              return result

          def read_m3u(path):
              if not path.exists():
                  return []
              try:
                  return parse_m3u(
                      path.read_text(encoding="utf-8", errors="ignore")
                  )
              except Exception as e:
                  print("Dosya okuma hatası:", path, e)
                  return []

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]
              for info, url in entries:
                  lines.extend([info, url])
              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def channel_name(entry):
              match = re.search(r",(.+)$", entry[0])
              return match.group(1).strip() if match else ""

          def channel_key(entry):
              match = re.search(
                  r'tvg-id="([^"]+)"', entry[0], re.I
              )
              name = match.group(1) if match else channel_name(entry)
              return normalize(name)

          def is_turkish(entry):
              info = entry[0]
              name = channel_name(entry)
              normalized = normalize(name)

              if not normalized:
                  return False

              if re.search(
                  r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",
                  name
              ):
                  return False

              country = re.search(
                  r'tvg-country="([^"]+)"', info, re.I
              )

              if country:
                  codes = [
                      x.strip().upper()
                      for x in country.group(1).split(",")
                  ]
                  if not any(
                      x in ("TR", "TUR", "TURKEY", "TÜRKİYE")
                      for x in codes
                  ):
                      return False

              if any(normalize(x) in normalized for x in FOREIGN_BLOCK):
                  return False

              if normalized in ALLOWED:
                  return True

              return bool(country)

          def unique(entries):
              seen = set()
              result = []

              for entry in entries:
                  url = entry[1].strip()
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  result.append(entry)

              return result

          def fetch_source(url):
              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=25
                  )
                  response.raise_for_status()
                  entries = parse_m3u(response.text)
                  print("Kaynak:", url, "Kanal:", len(entries))
                  return entries
              except Exception as e:
                  print("Kaynak hatası:", url, str(e))
                  return []

          def check_stream(entry):
              url = entry[1]

              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True
                  )

                  status = response.status_code
                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).lower()

                  first = next(response.iter_content(512), b"")
                  response.close()

                  if status != 200:
                      return False

                  if not first:
                      return False

                  if b"<html" in first.lower():
                      return False

                  if b"<!doctype html" in first.lower():
                      return False

                  return True

              except Exception:
                  return False

          def load_state():
              if not STATE.exists():
                  return {}
              try:
                  return json.loads(
                      STATE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def main():
              if not BACKUP.exists():
                  raise RuntimeError(
                      "yedek-445.m3u bulunamadi! "
                      "Manuel kanallari korumak icin islem durduruldu."
                  )

              manual = unique(read_m3u(BACKUP))
              previous = read_m3u(AUTO)

              # Manuel kanallar yedek dosyasindan alınır.
              # İsimleri, URL'leri ve kategorileri değiştirilmez.
              manual_urls = {url for _, url in manual}

              print("Manuel yedekten alınan kanal:", len(manual))

              all_sources = []

              with ThreadPoolExecutor(max_workers=10) as pool:
                  for result in pool.map(fetch_source, SOURCES):
                      all_sources.extend(result)

              # Otomatik listede yalnızca Türkiye kanalları.
              candidates = [
                  e for e in all_sources
                  if is_turkish(e)
                  and e[1] not in manual_urls
              ]

              candidates = unique(candidates)

              # Aynı kanal için alternatif yayınları bir arada tut.
              groups = {}
              for entry in candidates:
                  key = channel_key(entry)
                  if not key:
                      continue
                  groups.setdefault(key, []).append(entry)

              old_state = load_state()
              new_state = {}
              selected = []

              for key, entries in groups.items():
                  old = old_state.get(key, {})
                  old_url = old.get("url")

                  entries.sort(
                      key=lambda e: (
                          0 if e[1] == old_url else 1
                      )
                  )

                  selected.extend(entries[:MAX_ALTERNATIVES])

              selected = unique(selected)[:MAX_CHANNELS]

              print("Kontrol edilecek otomatik yayın:", len(selected))

              results = {}

              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  checks = list(pool.map(check_stream, selected))

              for entry, working in zip(selected, checks):
                  key = channel_key(entry)
                  old = old_state.get(key, {})
                  failures = old.get("failures", 0)

                  if working:
                      failures = 0
                      results.setdefault(key, []).append(entry)
                  else:
                      failures += 1

                  new_state.setdefault(key, {
                      "url": old.get("url", ""),
                      "failures": failures
                  })

              auto_working = []

              for key, entries in results.items():
                  if not entries:
                      continue

                  old = old_state.get(key, {})
                  old_url = old.get("url")

                  entries.sort(
                      key=lambda e: 0 if e[1] == old_url else 1
                  )

                  # Çalışan alternatiflerin hepsi listede tutulur.
                  auto_working.extend(entries)

                  new_state[key] = {
                      "url": entries[0][1],
                      "failures": 0
                  }

              # Dört başarısız kontrolden sonra otomatik kanal kaydı temizlenir.
              for key, old in old_state.items():
                  if key not in new_state:
                      failures = old.get("failures", 0) + 1
                      if failures < FAIL_LIMIT:
                          new_state[key] = {
                              "url": old.get("url", ""),
                              "failures": failures
                          }

              auto_working = unique(auto_working)

              # Manuel kanallar test edilmeden ve filtrelenmeden korunur.
              manual_working = list(manual)

              final_entries = unique(
                  manual_working + auto_working
              )

              write_m3u(AUTO, auto_working)
              write_m3u(MANUAL, manual_working)
              write_m3u(MAIN, final_entries)

              STATE.write_text(
                  json.dumps(
                      new_state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("--------------------------------")
              print("Manuel kanal:", len(manual_working))
              print("Otomatik kanal:", len(auto_working))
              print("Toplam kanal:", len(final_entries))
              print("Güncelleme tamamlandı.")
              print("--------------------------------")

          if __name__ == "__main__":
              main()
          PY

      - name: Run updater
        run: python updater.py

      - name: Commit updated playlists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "IPTV automatic update"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json"
