
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update IPTV
        run: |
          cat > updater.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import requests
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor, as_completed

          MAIN = "Turgut.m3u"
          AUTO = "Turgut_auto.m3u"
          MANUAL = "manual.m3u"
          STATE = "stream_state.json"
          REPORT = "Turgut_report.txt"

          FAIL_LIMIT = 5
          MIN_FAIL_AGE_HOURS = 36
          TIMEOUT = 15
          WORKERS = 25

          OUTPUTS = {
              "Türkiye": "turkiye.m3u",
              "Türk Spor": "turk-spor.m3u",
              "Dünya Spor": "world-sport.m3u",
              "Peru": "peru.m3u",
              "Film-Dizi": "film-dizi.m3u",
              "Haber": "haber.m3u",
              "Müzik": "muzik.m3u",
              "Çocuk": "cocuk.m3u",
              "Radyo": "radyo.m3u",
              "Belgesel": "belgesel.m3u",
          }

          SOURCES = [
              ("https://iptv-org.github.io/iptv/countries/tr.m3u", "turkish"),
              ("https://iptv-org.github.io/iptv/languages/tur.m3u", "turkish"),
              ("https://iptv-org.github.io/iptv/countries/pe.m3u", "peru"),
              ("https://iptv-org.github.io/iptv/categories/sports.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/radio.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/news.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/music.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/movies.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/series.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/kids.m3u", "general"),
              ("https://iptv-org.github.io/iptv/categories/documentary.m3u", "general"),
              ("https://raw.githubusercontent.com/nexonic/iptv/main/turkey.m3u", "turkish"),
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 IPTV playlist updater",
              "Accept": "*/*",
          }

          TURKISH_NAMES = [
              "trt 1", "trt 2", "trt haber", "trt spor",
              "trt spor yildiz", "trt cocuk", "trt belgesel",
              "trt muzik", "trt turk", "atv", "a haber", "a spor",
              "a para", "kanal d", "show tv", "star tv", "now tv",
              "fox", "tv8", "tv8 5", "beyaz tv", "teve2",
              "kanal 7", "ulke tv", "24 tv", "haber global",
              "ntv", "haberturk", "cnn turk", "ekol tv",
              "sozcu tv", "flash haber", "ht spor", "sports tv",
              "tivibu spor", "power turk", "kral pop", "kral fm",
              "power fm", "dream turk", "number one", "number1",
              "minika go", "minika cocuk", "tvnet",
              "ulusal kanal", "tele1", "kanal 32", "kanal 33",
              "kanal 34", "icel tv", "kanal hayat", "a2 tv",
              "360 tv", "fb tv", "gs tv", "bjk tv",
          ]

          TURK_SPORT_NAMES = [
              "trt spor", "trt spor yildiz", "a spor", "ht spor",
              "sports tv", "tivibu spor", "tabii spor",
              "fb tv", "fenerbahce tv", "gs tv",
              "galatasaray tv", "bjk tv", "besiktas tv",
          ]

          INTERNATIONAL_SPORT_NAMES = [
              "espn", "espn 1", "espn 2", "espn 3", "espn 4",
              "espn premium", "espn sur", "espn deportes",
              "espn brasil", "espn argentina", "espn chile",
              "espn colombia", "espn peru", "espn uruguay",
              "espn mexico", "espn centroamerica",
              "bein sports", "bein sports usa", "bein sports xtra",
              "bein sports en espanol", "bein sports espanol",
              "l1 max", "l1max", "liga 1 max", "liga max", "limax",
          ]

          PERU_NAMES = [
              "latina tv", "latina television",
              "america tv", "america television",
          ]

          def norm(value):
              value = str(value or "").lower()
              table = str.maketrans({
                  "ı": "i", "ğ": "g", "ü": "u",
                  "ş": "s", "ö": "o", "ç": "c",
                  "á": "a", "é": "e",
              })
              value = value.translate(table)
              value = re.sub(r"[^a-z0-9]+", " ", value)
              return " ".join(value.split())

          def read_text(path):
              if not os.path.exists(path):
                  return ""
              with open(path, "r", encoding="utf-8", errors="replace") as f:
                  return f.read()

          def parse_m3u(content, force_turkish=False):
              records = []
              current = []

              for raw in content.splitlines():
                  line = raw.strip()
                  if not line or line == "#EXTM3U":
                      continue

                  if line.startswith("#EXTINF:"):
                      if current:
                          records.append(current)
                      current = [line]
                  elif current:
                      current.append(line)
                      if line.startswith(("http://", "https://")):
                          records.append(current)
                          current = []

              if current:
                  records.append(current)

              result = []
              for lines in records:
                  url = next(
                      (x for x in lines if x.startswith(("http://", "https://"))),
                      None
                  )
                  if not url:
                      continue

                  info = next(
                      (x for x in lines if x.startswith("#EXTINF:")), ""
                  )

                  result.append({
                      "lines": lines,
                      "url": url,
                      "info": info,
                      "force_turkish": force_turkish,
                  })

              return result

          def channel_name(record):
              info = record.get("info", "")
              return info.rsplit(",", 1)[-1].strip() if "," in info else ""

          def group_name(record):
              info = record.get("info", "")
              match = re.search(r'group-title="([^"]*)"', info, re.I)
              return match.group(1) if match else ""

          def attributes(record):
              return norm(record.get("info", ""))

          def is_turkish(record):
              if record.get("force_turkish"):
                  return True

              name = norm(channel_name(record))
              group = norm(group_name(record))
              data = attributes(record)

              known = any(norm(x) in name for x in TURKISH_NAMES)
              metadata = (
                  'tvg-country="tr"' in data
                  or 'tvg-language="turkish"' in data
                  or "turkish" in group
                  or "turkiye" in group
                  or "turkey" in group
                  or "turkce" in group
              )
              return known or metadata

          def is_peru_channel(record):
              name = norm(channel_name(record))
              return any(norm(x) in name for x in PERU_NAMES)

          def is_turk_sport(record):
              name = norm(channel_name(record))
              return any(norm(x) in name for x in TURK_SPORT_NAMES)

          def is_world_sport(record):
              name = norm(channel_name(record))
              return any(norm(x) in name for x in INTERNATIONAL_SPORT_NAMES)

          def classify(record):
              name = norm(channel_name(record))
              group = norm(group_name(record))

              if is_peru_channel(record):
                  return "Peru"

              if is_world_sport(record):
                  return "Dünya Spor"

              if is_turk_sport(record):
                  return "Türk Spor"

              if not is_turkish(record):
                  return None

              if any(x in name or x in group for x in [
                  "radyo", "radio", "fm"
              ]):
                  return "Radyo"

              if any(x in name or x in group for x in [
                  "haber", "news", "ntv", "cnn turk",
                  "haberturk", "ekol tv", "sozcu tv", "tele1"
              ]):
                  return "Haber"

              if any(x in name or x in group for x in [
                  "muzik", "music", "kral pop", "power turk",
                  "dream turk", "number one"
              ]):
                  return "Müzik"

              if any(x in name or x in group for x in [
                  "cocuk", "kids", "minika", "cartoon"
              ]):
                  return "Çocuk"

              if any(x in name or x in group for x in [
                  "belgesel", "documentary"
              ]):
                  return "Belgesel"

              if any(x in group for x in [
                  "movie", "movies", "film", "series", "dizi"
              ]):
                  return "Film-Dizi"

              if "sports" in group or "spor" in group:
                  return "Türk Spor"

              return "Türkiye"

          def fetch_source(url):
              try:
                  response = requests.get(
                      url, headers=HEADERS, timeout=25
                  )
                  response.raise_for_status()

                  if "#EXTM3U" not in response.text[:5000]:
                      return None

                  return response.text
              except Exception as exc:
                  print("Kaynak erişilemedi:", url, str(exc)[:180])
                  return None

          def check_stream(record):
              try:
                  response = requests.get(
                      record["url"],
                      headers={**HEADERS, "Range": "bytes=0-4095"},
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True,
                  )

                  status = response.status_code
                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).lower()

                  if status in (404, 410):
                      response.close()
                      return "dead"

                  if status in (403, 429) or status >= 500:
                      response.close()
                      return "unknown"

                  if status not in (200, 206):
                      response.close()
                      return "unknown"

                  chunk = next(response.iter_content(4096), b"")
                  response.close()
                  sample = chunk[:1000].lstrip().lower()

                  if b"<html" in sample or b"<!doctype html" in sample:
                      return "unknown"

                  if record["url"].lower().split("?")[0].endswith(".m3u8"):
                      if b"#extm3u" in sample or "mpegurl" in content_type:
                          return "ok"
                      return "unknown"

                  if chunk or "video" in content_type or "audio" in content_type:
                      return "ok"

                  return "unknown"

              except Exception:
                  return "unknown"

          def key_for(kind, url):
              digest = hashlib.sha256(url.encode("utf-8")).hexdigest()
              return kind + ":" + digest

          def unique(records):
              result = []
              seen = set()

              for record in records:
                  if record["url"] not in seen:
                      seen.add(record["url"])
                      result.append(record)

              return result

          def write_playlist(path, records):
              output = ["#EXTM3U"]

              for record in records:
                  output.extend(record["lines"])

              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(output) + "\n")

          def load_state():
              try:
                  return json.loads(read_text(STATE) or "{}")
              except Exception:
                  return {}

          def validate_records(records, kind, state, report):
              kept = []
              now = datetime.now(timezone.utc)

              for record in records:
                  key = key_for(kind, record["url"])
                  entry = state.get(key, {})
                  result = check_stream(record)

                  if result == "ok":
                      state[key] = {
                          "failures": 0,
                          "first_failure": None,
                          "last_result": "ok",
                      }
                      kept.append(record)
                      continue

                  if result == "unknown":
                      entry["last_result"] = "unknown"
                      state[key] = entry
                      kept.append(record)
                      report.append(
                          "Belirsiz kontrol, yayın korundu: "
                          + channel_name(record)
                      )
                      continue

                  if not entry.get("first_failure"):
                      entry["first_failure"] = now.isoformat()

                  entry["failures"] = int(entry.get("failures", 0)) + 1
                  entry["last_result"] = "dead"
                  state[key] = entry

                  try:
                      first = datetime.fromisoformat(entry["first_failure"])
                      age = now - first
                  except Exception:
                      age = timedelta(0)

                  if (
                      entry["failures"] >= FAIL_LIMIT
                      and age >= timedelta(hours=MIN_FAIL_AGE_HOURS)
                  ):
                      report.append(
                          "Bozuk yayın kaldırıldı: " + channel_name(record)
                      )
                  else:
                      kept.append(record)
                      report.append(
                          "Yayın korundu: " + channel_name(record)
                          + " | " + str(entry["failures"])
                          + "/" + str(FAIL_LIMIT)
                      )

              return kept

          def main():
              report = []
              state = load_state()

              old_auto = parse_m3u(read_text(AUTO))
              manual = parse_m3u(read_text(MANUAL))
              old_main = parse_m3u(read_text(MAIN))

              manual_urls = {r["url"] for r in manual}
              auto_urls = {r["url"] for r in old_auto}

              for record in old_main:
                  if (
                      record["url"] not in manual_urls
                      and record["url"] not in auto_urls
                  ):
                      manual.append(record)
                      manual_urls.add(record["url"])

              discovered = []
              successful_sources = 0

              for url, source_type in SOURCES:
                  content = fetch_source(url)

                  if content is None:
                      continue

                  successful_sources += 1
                  force = source_type == "turkish"

                  for record in parse_m3u(content, force_turkish=force):
                      category = classify(record)
                      if category:
                          record["category"] = category
                          discovered.append(record)

              if successful_sources == 0:
                  raise RuntimeError(
                      "Hiçbir kaynak açılamadı. Mevcut listeler korundu."
                  )

              discovered = unique(discovered)
              checked_new = []

              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  futures = {
                      pool.submit(check_stream, record): record
                      for record in discovered
                  }

                  for future in as_completed(futures):
                      record = futures[future]

                      try:
                          result = future.result()
                      except Exception:
                          result = "unknown"

                      if result in ("ok", "unknown"):
                          checked_new.append(record)

              old_auto = validate_records(
                  old_auto, "auto", state, report
              )

              manual = validate_records(
                  manual, "manual", state, report
              )

              manual = unique(manual)
              manual_urls = {r["url"] for r in manual}

              checked_new = [
                  r for r in checked_new
                  if r["url"] not in manual_urls
              ]

              auto = unique(old_auto + checked_new)
              combined = unique(manual + auto)

              write_playlist(MANUAL, manual)
              write_playlist(AUTO, auto)
              write_playlist(MAIN, combined)

              for category, filename in OUTPUTS.items():
                  selected = [
                      r for r in combined
                      if classify(r) == category
                  ]
                  write_playlist(filename, selected)

              with open(STATE, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=2)

              report.insert(
                  0,
                  "Güncelleme: " + datetime.now(timezone.utc).isoformat()
              )
              report.insert(
                  1,
                  "Başarılı kaynak: "
                  + str(successful_sources) + "/" + str(len(SOURCES))
              )
              report.insert(2, "Yeni keşfedilen: " + str(len(checked_new)))
              report.insert(3, "Otomatik yayın: " + str(len(auto)))
              report.insert(4, "Manuel yayın: " + str(len(manual)))
              report.insert(5, "Toplam yayın: " + str(len(combined)))
              report.insert(
                  6,
                  "Peru kanal sayısı: "
                  + str(sum(1 for r in combined if classify(r) == "Peru"))
              )

              with open(REPORT, "w", encoding="utf-8") as f:
                  f.write("\n".join(report) + "\n")

              print("\n".join(report))

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            Turgut.m3u \
            Turgut_auto.m3u \
            manual.m3u \
            stream_state.json \
            Turgut_report.txt \
            turkiye.m3u \
            turk-spor.m3u \
            world-sport.m3u \
            peru.m3u \
            film-dizi.m3u \
            haber.m3u \
            muzik.m3u \
            cocuk.m3u \
            radyo.m3u \
            belgesel.m3u

          git diff --cached --quiet || git commit -m "Update IPTV playlists"
          git push
