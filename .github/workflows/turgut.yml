
name: Turgut IPTV Smart Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests

      - name: IPTV listesini güncelle
        run: |
          python - <<'PY'
          import re
          import json
          import requests
          import concurrent.futures
          from pathlib import Path

          PLAYLIST = Path("Turgut.m3u")
          AUTO_FILE = Path("Turgut_auto.m3u")
          FAIL_FILE = Path("manual_failures.json")

          MAX_AUTO_CHANNELS = 400
          MAX_FAILURES = 4
          TIMEOUT = 12

          SOURCES = [
              ("Türkiye", "https://iptv-org.github.io/iptv/countries/tr.m3u"),
              ("Peru", "https://iptv-org.github.io/iptv/countries/pe.m3u"),
              ("Spor", "https://iptv-org.github.io/iptv/categories/sports.m3u"),
              ("Arjantin", "https://iptv-org.github.io/iptv/countries/ar.m3u"),
              ("Brezilya", "https://iptv-org.github.io/iptv/countries/br.m3u"),
              ("Şili", "https://iptv-org.github.io/iptv/countries/cl.m3u"),
              ("Kolombiya", "https://iptv-org.github.io/iptv/countries/co.m3u"),
              ("Meksika", "https://iptv-org.github.io/iptv/countries/mx.m3u"),
              ("Ekvador", "https://iptv-org.github.io/iptv/countries/ec.m3u"),
              ("Uruguay", "https://iptv-org.github.io/iptv/countries/uy.m3u"),
              ("Paraguay", "https://iptv-org.github.io/iptv/countries/py.m3u"),
              ("Bolivya", "https://iptv-org.github.io/iptv/countries/bo.m3u"),
              ("Venezuela", "https://iptv-org.github.io/iptv/countries/ve.m3u"),
              ("Haber", "https://iptv-org.github.io/iptv/categories/news.m3u"),
              ("Müzik", "https://iptv-org.github.io/iptv/categories/music.m3u"),
              ("Film", "https://iptv-org.github.io/iptv/categories/movies.m3u"),
              ("Dizi", "https://iptv-org.github.io/iptv/categories/series.m3u"),
              ("Çocuk", "https://iptv-org.github.io/iptv/categories/kids.m3u"),
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*"
          }

          stats = {
              "working": 0,
              "temporary": 0,
              "failed": 0,
              "removed": 0
          }

          def parse_m3u(path):
              entries = []

              if not path.exists():
                  return entries

              lines = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines()

              info = None

              for line in lines:
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      info = line

                  elif line.startswith(("http://", "https://")):
                      if info:
                          entries.append({
                              "info": info,
                              "url": line
                          })
                          info = None

              return entries

          def write_m3u(path, entries):
              with path.open("w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")

                  for entry in entries:
                      f.write(entry["info"] + "\n")
                      f.write(entry["url"] + "\n")

          def name_of(entry):
              info = entry["info"]

              if "," in info:
                  return info.rsplit(",", 1)[-1].strip()

              return "Bilinmeyen Kanal"

          def group_of(entry):
              name = name_of(entry).lower()

              sports = [
                  "sport", "spor", "espn", "bein", "sky sports",
                  "fox sports", "dazn", "formula", "f1",
                  "motorsport", "liga max", "limax", "bicolor",
                  "l1 max", "tnt sports"
              ]

              music = [
                  "music", "müzik", "klip", "dream türk",
                  "power", "kral"
              ]

              kids = [
                  "cartoon", "kids", "çocuk", "nick",
                  "disney", "cartoonito", "junior"
              ]

              movies = [
                  "movie", "cinema", "film", "sinema",
                  "action", "hbo", "cinemax"
              ]

              news = [
                  "news", "haber", "cnn", "bbc",
                  "al jazeera", "ntv", "a haber",
                  "habertürk", "halk tv"
              ]

              europe = [
                  "avrupa", "euro", "international",
                  "trt türk", "show türk"
              ]

              turkey = [
                  "trt", "atv", "show tv", "kanal d",
                  "star tv", "now tv", "fox", "tv8",
                  "kanal 7", "beyaz tv", "teve2",
                  "360", "ülke tv", "tgrt", "24 tv",
                  "tele1", "ekol tv", "kanal 24"
              ]

              if any(x in name for x in sports):
                  return "Spor"

              if any(x in name for x in music):
                  return "Türkiye Müzik"

              if any(x in name for x in kids):
                  return "Çocuk"

              if any(x in name for x in movies):
                  return "Film ve Sinema"

              if any(x in name for x in news):
                  return "Haber"

              if any(x in name for x in europe):
                  return "Türkiye Avrupa"

              if any(x in name for x in turkey):
                  return "Türkiye Ulusal"

              return "Latin Amerika ve Dünya"

          def set_group(entry):
              group = group_of(entry)
              info = entry["info"]

              if re.search(r'group-title="[^"]*"', info):
                  info = re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      info,
                      count=1
                  )
              else:
                  info = info.replace(
                      "#EXTINF:",
                      '#EXTINF: group-title="' + group + '" ',
                      1
                  )

              return {
                  "info": info,
                  "url": entry["url"]
              }

          def fetch_source(source):
              label, url = source

              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=25
                  )
                  response.raise_for_status()

                  lines = response.text.splitlines()
                  entries = []
                  info = None

                  for line in lines:
                      line = line.strip()

                      if line.startswith("#EXTINF"):
                          info = line

                      elif line.startswith(("http://", "https://")):
                          if info:
                              entries.append({
                                  "info": info,
                                  "url": line
                              })
                              info = None

                  print(label, "kaynağı:", len(entries), "kanal")
                  return entries

              except Exception as error:
                  print(label, "kaynağı alınamadı:", error)
                  return []

          def check_stream(url):
              try:
                  response = requests.get(
                      url,
                      headers={
                          **HEADERS,
                          "Range": "bytes=0-0"
                      },
                      stream=True,
                      allow_redirects=True,
                      timeout=(5, TIMEOUT)
                  )

                  status = response.status_code
                  response.close()

                  if status in (404, 410):
                      return "bad"

                  if 200 <= status < 400:
                      return "ok"

                  return "temporary"

              except requests.exceptions.RequestException:
                  return "temporary"

              except Exception:
                  return "temporary"

          def sort_key(entry):
              group = group_of(entry)

              order = {
                  "Türkiye Ulusal": 0,
                  "Türkiye Avrupa": 1,
                  "Spor": 2,
                  "Haber": 3,
                  "Türkiye Müzik": 4,
                  "Film ve Sinema": 5,
                  "Çocuk": 6,
                  "Latin Amerika ve Dünya": 7
              }

              return (
                  order.get(group, 8),
                  name_of(entry).lower()
              )

          def unique_entries(entries):
              result = []
              seen = set()

              for entry in entries:
                  url = entry["url"].strip()

                  if not url or url in seen:
                      continue

                  seen.add(url)

                  result.append({
                      "info": entry["info"],
                      "url": url
                  })

              return result

          def main():
              failures = {}

              if FAIL_FILE.exists():
                  try:
                      failures = json.loads(
                          FAIL_FILE.read_text(encoding="utf-8")
                      )
                  except Exception:
                      failures = {}

              current = parse_m3u(PLAYLIST)
              previous_auto = parse_m3u(AUTO_FILE)

              previous_auto_urls = {
                  item["url"] for item in previous_auto
              }

              manual = [
                  item for item in current
                  if item["url"] not in previous_auto_urls
              ]

              print("Önceki otomatik kanal:", len(previous_auto))
              print("Manuel kanal:", len(manual))

              fetched = []

              with concurrent.futures.ThreadPoolExecutor(
                  max_workers=8
              ) as executor:
                  futures = [
                      executor.submit(fetch_source, source)
                      for source in SOURCES
                  ]

                  for future in concurrent.futures.as_completed(futures):
                      fetched.extend(future.result())

              auto_candidates = unique_entries(
                  fetched + previous_auto
              )

              manual_urls = {
                  item["url"] for item in manual
              }

              auto_candidates = [
                  item for item in auto_candidates
                  if item["url"] not in manual_urls
              ]

              if not auto_candidates and not manual:
                  raise RuntimeError(
                      "Kaynaklardan veya mevcut listeden kanal alınamadı. "
                      "Mevcut dosyalar korunarak işlem durduruldu."
                  )

              all_entries = unique_entries(
                  manual + auto_candidates
              )

              print("Kontrol edilecek toplam:", len(all_entries))

              results = {}

              with concurrent.futures.ThreadPoolExecutor(
                  max_workers=25
              ) as executor:
                  future_map = {
                      executor.submit(
                          check_stream, item["url"]
                      ): item["url"]
                      for item in all_entries
                  }

                  for future in concurrent.futures.as_completed(future_map):
                      url = future_map[future]

                      try:
                          results[url] = future.result()
                      except Exception:
                          results[url] = "temporary"

              kept_manual = []
              kept_auto = []

              for entry in all_entries:
                  url = entry["url"]
                  result = results.get(url, "temporary")

                  if result == "ok":
                      stats["working"] += 1
                      failures.pop(url, None)

                  elif result == "temporary":
                      stats["temporary"] += 1

                  else:
                      stats["failed"] += 1
                      failures[url] = int(failures.get(url, 0)) + 1

                  count = int(failures.get(url, 0))

                  if result == "bad" and count >= MAX_FAILURES:
                      stats["removed"] += 1
                      failures.pop(url, None)
                      print("4 başarısız kontrolde kaldırıldı:", name_of(entry))
                      continue

                  if url in manual_urls:
                      kept_manual.append(entry)
                  else:
                      kept_auto.append(set_group(entry))

              kept_auto = unique_entries(kept_auto)
              kept_auto.sort(key=sort_key)
              kept_auto = kept_auto[:MAX_AUTO_CHANNELS]

              kept_manual = unique_entries(kept_manual)

              combined = unique_entries(
                  kept_manual + kept_auto
              )

              combined.sort(key=sort_key)

              write_m3u(AUTO_FILE, kept_auto)
              write_m3u(PLAYLIST, combined)

              FAIL_FILE.write_text(
                  json.dumps(
                      failures,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("================================")
              print("Otomatik kanallar:", len(kept_auto))
              print("Manuel kanallar:", len(kept_manual))
              print("Çalışan yayınlar:", stats["working"])
              print("Geçici hatalar:", stats["temporary"])
              print("Başarısız kontroller:", stats["failed"])
              print("4 kontrolde kaldırılan:", stats["removed"])
              print("TOPLAM KANAL:", len(combined))
              print("Güncelleme başarılı!")
              print("================================")

          if __name__ == "__main__":
              main()
          PY

      - name: Değişiklikleri kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turgut IPTV playlist otomatik güncellendi"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual_failures.json"
