
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run IPTV updater
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > updater.py <<'PY'
          import re
          import json
          import time
          import html
          import hashlib
          import requests
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # ==========================================================
          # TURGUT IPTV TURKEY ULTIMATE
          # ==========================================================

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          BACKUP = Path("yedek-445.m3u")
          STATE = Path("stream_state.json")
          REPORT = Path("Turgut_report.txt")

          TIMEOUT = (8, 14)
          WORKERS = 20
          FAIL_LIMIT = 4
          MAX_TEST_PER_CHANNEL = 30
          MAX_ALTERNATIVES = 8

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/125.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Connection": "keep-alive"
          }

          # Public playlist sources. Non-Turkish channels are filtered below.
          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/languages/tur.m3u",
              "https://streams.uzunmuhalefet.com/lists/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u"
          ]

          # Official websites are scanned only for publicly exposed
          # M3U8 addresses. This does not bypass DRM or geo-blocking.
          OFFICIAL_SITES = {
              "ATV": "https://www.atv.com.tr/canli-yayin",
              "A2": "https://www.atv.com.tr/a2tv/canli-yayin",
              "Show TV": "https://www.showtv.com.tr/canli-yayin",
              "Kanal D": "https://www.kanald.com.tr/canli-yayin",
              "Star TV": "https://www.startv.com.tr/canli-yayin",
              "NOW": "https://www.nowtv.com.tr/canli-yayin",
              "TV8": "https://www.tv8.com.tr/canli-yayin",
              "TRT 1": "https://www.trt1.com.tr/canli-izle",
              "TRT Haber": "https://www.trthaber.com/canli-yayin-izle.html",
              "TRT Spor": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Spor Yıldız": "https://www.trtspor.com.tr/canli-yayin-izle",
              "TRT Çocuk": "https://www.trtcocuk.net.tr/canli",
              "TRT Belgesel": "https://www.trtbelgesel.com.tr/canli",
              "A Haber": "https://www.ahaber.com.tr/canli-yayin",
              "A Spor": "https://www.aspor.com.tr/webtv/canli-yayin",
              "NTV": "https://www.ntv.com.tr/canli-yayin",
              "CNN Türk": "https://www.cnnturk.com/canli-yayin",
              "Haber Global": "https://haberglobal.com.tr/canli-yayin",
              "Habertürk": "https://www.haberturk.com/canliyayin",
              "TV100": "https://www.tv100.com/canli-yayin",
              "Halk TV": "https://halktv.com.tr/canli-yayin",
              "Sözcü TV": "https://www.sozcu.com.tr/tv",
              "Kanal 7": "https://www.kanal7.com/canli-izle",
              "Beyaz TV": "https://www.beyaztv.com.tr/canli-yayin",
              "360": "https://www.tv360.com.tr/canli-yayin",
              "teve2": "https://www.teve2.com.tr/canli-yayin",
              "Bloomberg HT": "https://www.bloomberght.com/tv",
              "Kral TV": "https://www.kralmuzik.com.tr/kral-tv",
              "PowerTürk": "https://www.powerturk.com/tv",
              "Diyanet TV": "https://www.diyanet.tv/canli-yayin",
              "beIN SPORTS HABER": "https://bein-sports.com.tr/canli-tv"
          }

          # Channel allowlist. Other channels need a Turkish country tag
          # or a Turkish tvg-id to pass the filter.
          CHANNELS = {
              "atv", "a2", "show tv", "kanal d", "star tv", "now",
              "fox", "tv8", "tv8 5", "trt 1", "trt 2", "trt haber",
              "trt spor", "trt spor yildiz", "trt cocuk",
              "trt belgesel", "trt muzik", "trt turk", "trt avaz",
              "trt world", "trt eba", "a haber", "a spor", "a news",
              "ntv", "cnn turk", "haber global", "haberturk", "tv100",
              "halk tv", "sozcu tv", "kanal 7", "beyaz tv", "360",
              "teve2", "bloomberg ht", "bi kanal", "sifir tv",
              "fanatik tv", "kral tv", "powerturk", "diyanet tv",
              "beinsports haber", "bein sports haber",
              "beinsports 1", "beinsports 2", "beinsports 3",
              "beinsports 4", "beinsports 5",
              "tabii spor", "tabii spor 1", "tabii spor 2",
              "as tv", "bursa as tv", "kanal 3", "kanal 23",
              "kanal  urfa", "kanal  urfa", "kanal 7 avrupa",
              "ulusal kanal", "tele1", "flash haber", "ekol tv",
              "tvnet", "24 tv", "benguturk", "a para",
              "a2 tv", "minika go", "minika cocuk", "cartoon network",
              "cartoonito", "disney channel", "nickelodeon",
              "dream turk", "dream tv", "power tv", "power love",
              "number1 turk", "number1", "slow turk", "joyturk",
              "radyo 7 tv", "park tv", "tgrt haber", "tgrt belgesel",
              "kanal b", "kanal 7", "tv 4", "tv4", "kanal 26",
              "kanal 32", "kanal 33", "kanal 38", "kanal 42",
              "kanal 54", "kanal 58", "kanal 68", "kanal 78",
              "kanal 99", "edirne tv", "kon tv", "ostim tv",
              "line tv", "ege tv", "kackar tv", "kackar",
              "baba radyo tv", "tv kayseri"
          }

          FOREIGN_BLOCK = [
              "arab", "iraq", "iraqi", "syria", "syrian",
              "saudi", "qatar", "kuwait", "egypt", "iran",
              "persian", "afghanistan", "pakistan", "india",
              "bangladesh", "indonesia", "malaysia", "albania",
              "albanian", "greece", "greek", "germany",
              "german", "france", "french", "italy", "italian",
              "spain", "spanish", "portugal", "portuguese",
              "uk", "usa", "united states", "united kingdom",
              "russia", "russian", "ukraine", "poland",
              "netherlands", "dutch", "sweden", "norway",
              "denmark", "finland", "romania", "bulgaria",
              "serbia", "croatia", "bosnia", "japan",
              "korea", "china", "africa", "latin america"
          ]

          ALIASES = {
              "beinsportshaber": "beIN SPORTS HABER",
              "bein sports haber": "beIN SPORTS HABER",
              "bein sport haber": "beIN SPORTS HABER",
              "trtspor": "TRT Spor",
              "trt spor": "TRT Spor",
              "trtspor yildiz": "TRT Spor Yıldız",
              "trt spor yildiz": "TRT Spor Yıldız",
              "showtv": "Show TV",
              "kanald": "Kanal D",
              "startv": "Star TV",
              "ahaber": "A Haber",
              "aspor": "A Spor",
              "cnnturk": "CNN Türk",
              "sozcutv": "Sözcü TV"
          }

          QUALITY_WORDS = [
              "4k", "uhd", "fhd", "1080p", "720p", "hd",
              "sd", "backup", "yedek", "test", "low"
          ]

          # ==========================================================
          # HELPERS
          # ==========================================================

          def clean_name(name):
              name = html.unescape(name or "")
              name = name.replace("_", " ").replace("-", " ")
              name = re.sub(r"\s+", " ", name).strip()
              return name

          def norm(name):
              name = clean_name(name).lower()
              table = str.maketrans({
                  "ı": "i", "ğ": "g", "ü": "u",
                  "ş": "s", "ö": "o", "ç": "c"
              })
              name = name.translate(table)
              name = re.sub(r"\b(4k|uhd|fhd|1080p|720p|hd|sd)\b", "", name)
              name = re.sub(r"\b(backup|yedek|test|low)\b", "", name)
              return re.sub(r"\s+", " ", name).strip()

          def canonical(name):
              n = norm(name)
              compact = n.replace(" ", "")
              return ALIASES.get(compact, ALIASES.get(n, clean_name(name)))

          def channel_key(name):
              return norm(canonical(name))

          def category(name):
              n = norm(name)

              # Keep beIN Haber in the sports/news area, not as a
              # generic international sports channel.
              if "bein sports haber" in n or "beinsports haber" in n:
                  return "SPOR-HABER"

              if any(x in n for x in [
                  "trt spor", "a spor", "beinsports", "bein sports",
                  "tabii spor", "fanatik", "sport"
              ]):
                  return "SPOR"

              if any(x in n for x in [
                  "haber", "news", "ntv", "cnn turk", "bloomberg",
                  "tv100", "sozcu", "halk tv", "ulusal kanal"
              ]):
                  return "HABER"

              if any(x in n for x in [
                  "muzik", "music", "kral", "power", "dream",
                  "number1", "slow turk", "joyturk"
              ]):
                  return "MUZIK"

              if any(x in n for x in [
                  "cocuk", "kids", "minika", "cartoon", "nickelodeon"
              ]):
                  return "COCUK"

              if any(x in n for x in [
                  "film", "movie", "sinema", "movie", "dizi"
              ]):
                  return "FILM-DIZI"

              return "ULUSAL-KANALLAR"

          def attrs_from_extinf(extinf):
              result = {}
              for key, value in re.findall(
                  r'([\w-]+)="([^"]*)"', extinf or ""
              ):
                  result[key.lower()] = value
              return result

          def parse_m3u(text):
              items = []
              current = []

              for raw in (text or "").splitlines():
                  line = raw.strip()

                  if not line or line == "#EXTM3U":
                      continue

                  if line.startswith("#EXTINF"):
                      if current:
                          current = []
                      current = [line]
                      continue

                  if line.startswith("#"):
                      if current:
                          current.append(line)
                      continue

                  if line.startswith("http://") or line.startswith("https://"):
                      if not current:
                          current = [f'#EXTINF:-1,{line}']

                      current.append(line)
                      extinf = next(
                          (x for x in current if x.startswith("#EXTINF")),
                          f"#EXTINF:-1,{line}"
                      )
                      name = extinf.split(",", 1)[-1].strip()
                      attrs = attrs_from_extinf(extinf)

                      items.append({
                          "name": clean_name(name),
                          "url": line,
                          "extinf": extinf,
                          "lines": list(current),
                          "attrs": attrs
                      })
                      current = []

              return items

          def read_items(path):
              if not path.exists():
                  return []
              try:
                  return parse_m3u(path.read_text(
                      encoding="utf-8", errors="ignore"
                  ))
              except Exception as e:
                  print(f"Dosya okunamadı: {path}: {e}")
                  return []

          def render_item(item, name=None):
              lines = list(item.get("lines", []))
              if not lines:
                  lines = [
                      item.get("extinf", "#EXTINF:-1,Unknown"),
                      item["url"]
                  ]

              ext_index = next(
                  (i for i, x in enumerate(lines)
                   if x.startswith("#EXTINF")),
                  None
              )

              if ext_index is not None and name is not None:
                  first = lines[ext_index]
                  before, sep, _ = first.partition(",")
                  lines[ext_index] = before + "," + name

              if not any(
                  x.startswith("http://") or x.startswith("https://")
                  for x in lines
              ):
                  lines.append(item["url"])

              return lines

          def write_playlist(path, items):
              output = ["#EXTM3U"]
              for item in items:
                  output.extend(render_item(item))
              path.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

          def is_turkish(item):
              name = norm(item.get("name", ""))
              attrs = item.get("attrs", {})
              country = norm(attrs.get("tvg-country", ""))
              tvg_id = norm(attrs.get("tvg-id", ""))

              combined = (
                  name + " " + country + " " + tvg_id
              ).lower()

              if any(word in combined for word in FOREIGN_BLOCK):
                  return False

              # Reject Arabic-script names.
              if re.search(r"[\u0600-\u06FF]", combined):
                  return False

              if country in {"tr", "tur", "turkey", "turkiye"}:
                  return True

              if tvg_id.endswith(".tr") or tvg_id.endswith(".tr.tv"):
                  return True

              if name in CHANNELS:
                  return True

              # Known Turkish channel names may contain quality tags
              # or small spelling differences.
              if channel_key(item.get("name", "")) in {
                  norm(x) for x in CHANNELS
              }:
                  return True

              return False

          def fetch_text(url, timeout=18):
              try:
                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=timeout
                  )
                  if response.status_code != 200:
                      return None
                  return response.text
              except Exception as e:
                  print(f"Kaynak alınamadı: {url} ({e})")
                  return None

          # ==========================================================
          # OFFICIAL SITE DISCOVERY
          # ==========================================================

          def official_scan():
              found = []

              pattern = re.compile(
                  r"""https?:\\?/\\?/[^"'\\\s<>]+?\.m3u8
                  (?:\?[^"'\\\s<>]*)?""",
                  re.IGNORECASE | re.VERBOSE
              )

              for channel, page in OFFICIAL_SITES.items():
                  text = fetch_text(page)
                  if not text:
                      continue

                  text = (
                      text.replace("\\/", "/")
                          .replace("&amp;", "&")
                          .replace("\\u0026", "&")
                  )

                  urls = pattern.findall(text)
                  urls += re.findall(
                      r"""["']([^"']+\.m3u8(?:\?[^"']*)?)["']""",
                      text,
                      re.IGNORECASE
                  )

                  for url in urls:
                      url = url.strip().rstrip("\\")
                      if url.startswith("//"):
                          url = "https:" + url
                      if not url.startswith("http"):
                          url = urljoin(page, url)

                      found.append({
                          "name": channel,
                          "url": url,
                          "extinf": (
                              f'#EXTINF:-1 group-title="{category(channel)}",'
                              f'{channel}'
                          ),
                          "lines": [
                              f'#EXTINF:-1 group-title="{category(channel)}",'
                              f'{channel}',
                              url
                          ],
                          "attrs": {}
                      })

              return found

          # ==========================================================
          # STREAM VALIDATION
          # ==========================================================

          def request_bytes(url, headers=None):
              h = dict(HEADERS)
              if headers:
                  h.update(headers)

              return requests.get(
                  url,
                  headers=h,
                  timeout=TIMEOUT,
                  allow_redirects=True,
                  stream=True
              )

          def valid_hls(url, depth=0):
              if depth > 1:
                  return False, "playlist derinliği"

              try:
                  response = request_bytes(
                      url,
                      {"Range": "bytes=0-65535"}
                  )

                  if response.status_code not in (200, 206):
                      return False, f"HTTP {response.status_code}"

                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).lower()

                  data = response.raw.read(65536, decode_content=True)
                  response.close()

                  if not data:
                      return False, "boş cevap"

                  # A valid HLS playlist must begin with #EXTM3U.
                  text = data.decode("utf-8", errors="ignore").lstrip(
                      "\ufeff\r\n\t "
                  )

                  if not text.startswith("#EXTM3U"):
                      if "text/html" in content_type or "<html" in text.lower():
                          return False, "HTML sayfası döndü"
                      return False, "HLS manifest değil"

                  lines = [
                      x.strip() for x in text.splitlines()
                      if x.strip()
                  ]

                  # Master playlist: test one child variant manifest.
                  if any("#EXT-X-STREAM-INF" in x for x in lines):
                      for i, line in enumerate(lines):
                          if "#EXT-X-STREAM-INF" in line:
                              for child in lines[i + 1:]:
                                  if not child.startswith("#"):
                                      child_url = urljoin(url, child)
                                      return valid_hls(
                                          child_url, depth + 1
                                      )
                      return False, "master playlist içinde varyant yok"

                  # Media playlist: test a media segment.
                  segment = next(
                      (
                          x for x in lines
                          if not x.startswith("#")
                          and (
                              ".ts" in x.lower()
                              or ".m4s" in x.lower()
                              or ".aac" in x.lower()
                              or ".mp4" in x.lower()
                              or "/" in x
                          )
                      ),
                      None
                  )

                  if segment:
                      segment_url = urljoin(url, segment)
                      try:
                          seg = request_bytes(
                              segment_url,
                              {"Range": "bytes=0-1023"}
                          )
                          ok = seg.status_code in (200, 206)
                          seg.close()
                          if ok:
                              return True, "HLS ve segment erişilebilir"
                          return False, f"segment HTTP {seg.status_code}"
                      except Exception as e:
                          return False, f"segment hatası: {e}"

                  if "#EXT-X-ENDLIST" in text:
                      return True, "sonlu HLS listesi"

                  return False, "manifestte medya segmenti bulunamadı"

              except requests.exceptions.Timeout:
                  return False, "zaman aşımı"
              except Exception as e:
                  return False, str(e)[:120]

          def check_stream(item):
              ok, reason = valid_hls(item["url"])
              return item, ok, reason

          # ==========================================================
          # SOURCE COLLECTION
          # ==========================================================

          def collect_sources():
              candidates = []

              for source in SOURCES:
                  print(f"Kaynak taranıyor: {source}")
                  text = fetch_text(source)
                  if not text:
                      continue

                  for item in parse_m3u(text):
                      if is_turkish(item):
                          candidates.append(item)

              candidates.extend(official_scan())

              extra = Path("ekstra_alternatifler.txt")
              if extra.exists():
                  for raw in extra.read_text(
                      encoding="utf-8", errors="ignore"
                  ).splitlines():
                      line = raw.strip()
                      if not line or line.startswith("#"):
                          continue

                      parts = line.split("|", 1)
                      if len(parts) != 2:
                          continue

                      name, url = parts[0].strip(), parts[1].strip()
                      item = {
                          "name": clean_name(name),
                          "url": url,
                          "extinf": (
                              f'#EXTINF:-1 group-title="{category(name)}",'
                              f'{name}'
                          ),
                          "lines": [
                              f'#EXTINF:-1 group-title="{category(name)}",'
                              f'{name}',
                              url
                          ],
                          "attrs": {}
                      }

                      if is_turkish(item):
                          candidates.append(item)

              return candidates

          # ==========================================================
          # MANUAL PLAYLIST PROTECTION
          # ==========================================================

          def get_manual_items(previous_auto):
              if MANUAL.exists():
                  print("Manuel liste: manual.m3u kullanılıyor.")
                  return read_items(MANUAL)

              if BACKUP.exists():
                  print("Manuel liste: yedek-445.m3u kullanılıyor.")
                  items = read_items(BACKUP)
                  write_playlist(MANUAL, items)
                  return items

              # If both manual and backup are absent, recover entries
              # from the existing main playlist that are not in AUTO.
              main_items = read_items(MAIN)
              old_urls = {
                  x["url"] for x in previous_auto
              }

              recovered = [
                  x for x in main_items
                  if x["url"] not in old_urls
              ]

              if recovered:
                  print(
                      "UYARI: Manuel dosya bulunamadı. "
                      "Ana listeden otomatik olmayan kayıtlar kurtarıldı."
                  )
                  write_playlist(MANUAL, recovered)
                  return recovered

              print(
                  "UYARI: Manuel liste veya yedek bulunamadı. "
                  "Yeni manuel liste boş başlayacak."
              )
              write_playlist(MANUAL, [])

              return []

          def create_backup_once(manual_items):
              # Never overwrite an existing backup.
              if BACKUP.exists():
                  return

              print("İlk yedek oluşturuluyor: yedek-445.m3u")
              write_playlist(BACKUP, manual_items)

          # ==========================================================
          # MAIN
          # ==========================================================

          def main():
              started = time.time()

              try:
                  old_state = json.loads(
                      STATE.read_text(encoding="utf-8")
                  ) if STATE.exists() else {}
              except Exception:
                  old_state = {}

              previous_auto = read_items(AUTO)
              manual_items = get_manual_items(previous_auto)
              create_backup_once(manual_items)

              candidates = collect_sources()

              # Add last known automatic entries so that a temporary
              # source-discovery failure does not erase all channels.
              candidates.extend(previous_auto)

              # Group by channel and remove duplicate URLs.
              grouped = {}
              seen = set()

              for item in candidates:
                  url = item.get("url", "").strip()
                  name = clean_name(item.get("name", ""))

                  if not url.startswith(("http://", "https://")):
                      continue

                  if not url.lower().split("?")[0].endswith(".m3u8"):
                      continue

                  item["name"] = canonical(name)

                  if not is_turkish(item):
                      continue

                  if url in seen:
                      continue

                  seen.add(url)
                  key = channel_key(item["name"])

                  if not key:
                      continue

                  grouped.setdefault(key, []).append(item)

              # Previous known-good streams get priority.
              previous_urls = {
                  x["url"] for x in previous_auto
              }

              for key in grouped:
                  grouped[key].sort(
                      key=lambda x: (
                          x["url"] not in previous_urls,
                          len(x["url"])
                      )
                  )

              new_state = {}
              final_auto = []
              passed_count = 0
              stale_count = 0
              failed_count = 0
              channel_count = 0
              diagnostics = []

              for key, items in sorted(grouped.items()):
                  channel_count += 1
                  selected = []
                  tested = 0

                  for item in items:
                      if tested >= MAX_TEST_PER_CHANNEL:
                          break

                      tested += 1
                      url = item["url"]
                      old = old_state.get(url, {})
                      previous_failures = int(
                          old.get("failures", 0)
                      )

                      _, ok, reason = check_stream(item)

                      if ok:
                          new_state[url] = {
                              "failures": 0,
                              "last_ok": int(time.time()),
                              "status": "working"
                          }
                          selected.append(item)
                          passed_count += 1

                          print(
                              f"OK: {item['name']} - "
                              f"{urlparse(url).netloc}"
                          )

                      else:
                          failures = previous_failures + 1
                          failed_count += 1

                          new_state[url] = {
                              "failures": failures,
                              "last_fail": int(time.time()),
                              "status": "failed",
                              "reason": reason
                          }

                          diagnostics.append(
                              f"{item['name']} | {reason} | "
                              f"{urlparse(url).netloc}"
                          )

                          # Keep a previously known stream temporarily
                          # during short outages, but mark it as stale.
                          if (
                              url in previous_urls
                              and failures < FAIL_LIMIT
                          ):
                              selected.append(item)
                              stale_count += 1
                              new_state[url]["status"] = "stale"

                              print(
                                  f"GEÇİCİ KORUNDU: {item['name']} "
                                  f"- {reason} ({failures}/{FAIL_LIMIT})"
                              )
                          else:
                              print(
                                  f"BAŞARISIZ: {item['name']} - {reason}"
                              )

                      if len(selected) >= MAX_ALTERNATIVES:
                          break

                  # One channel can have several separate entries.
                  # Televizo may show them as alternatives, but automatic
                  # failover depends on the player/provider.
                  for index, item in enumerate(selected):
                      output = dict(item)

                      if index > 0:
                          output["lines"] = list(item["lines"])
                          output["name"] = (
                              f'{item["name"]} - Alternatif {index + 1}'
                          )

                          output["lines"] = render_item(
                              item, output["name"]
                          )

                      final_auto.append(output)

              # Keep manual entries first, then automatic entries.
              write_playlist(AUTO, final_auto)

              combined = []
              manual_urls = set()

              for item in manual_items:
                  if item["url"] not in manual_urls:
                      combined.append(item)
                      manual_urls.add(item["url"])

              for item in final_auto:
                  if item["url"] not in manual_urls:
                      combined.append(item)
                      manual_urls.add(item["url"])

              write_playlist(MAIN, combined)

              STATE.write_text(
                  json.dumps(
                      new_state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              elapsed = round(time.time() - started, 1)

              report = [
                  "TURGUT IPTV TURKEY ULTIMATE RAPORU",
                  "=================================",
                  f"Güncelleme zamanı: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}",
                  f"Çalışma süresi: {elapsed} saniye",
                  "",
                  f"Bulunan kanal grubu: {channel_count}",
                  f"Çalıştığı doğrulanan yayın: {passed_count}",
                  f"Geçici korunan eski yayın: {stale_count}",
                  f"Başarısız kontrol: {failed_count}",
                  f"Manuel kanal kaydı: {len(manual_items)}",
                  f"Otomatik kanal kaydı: {len(final_auto)}",
                  f"Birleşik liste kaydı: {len(combined)}",
                  "",
                  "ÖNEMLİ:",
                  "- Kontroller GitHub Actions sunucusundan yapılır.",
                  "- Bu testler Peru'dan erişimi garanti etmez.",
                  "- HLS segment kontrolü gerçek cihazda oynatma garantisi değildir.",
                  "- Alternatif kayıtlar Televizo'da ayrı kanal olarak görünebilir.",
                  "- Adaptif kalite, yayın kaynağı ve oynatıcı desteğine bağlıdır.",
                  "",
                  "beIN SPORTS HABER RESMÎ SAYFASI:",
                  "https://bein-sports.com.tr/canli-tv",
                  "Resmî sayfada doğrulanmış doğrudan M3U8 adresi bulunamadı.",
                  "Bu nedenle doğrulanmamış üçüncü taraf adresi eklenmedi.",
                  "",
                  "BAŞARISIZ / SORUNLU KAYNAKLAR:"
              ]

              report.extend(diagnostics[:150])

              REPORT.write_text(
                  "\n".join(report) + "\n",
                  encoding="utf-8"
              )

              print("\n".join(report))
              print("\nGüncelleme tamamlandı.")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Commit updated playlists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Turkish IPTV playlist"
          file_pattern: |
            Turgut.m3u
            Turgut_auto.m3u
            manual.m3u
            yedek-445.m3u
            stream_state.json
            Turgut_report.txt
