
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update IPTV
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > updater.py <<'PY'
          import re
          import json
          import time
          import html
          import hashlib
          import unicodedata
          import requests
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          BACKUP = Path("yedek-445.m3u")
          STATE = Path("stream_state.json")
          REPORT = Path("Turgut_report.txt")

          TIMEOUT = (8, 15)
          WORKERS = 20
          FAIL_LIMIT = 4
          MAX_ALTERNATIVES = 8
          MAX_TEST_PER_CHANNEL = 40
          MAX_SOURCE_ITEMS = 10000

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36",
              "Accept": "*/*",
              "Connection": "keep-alive"
