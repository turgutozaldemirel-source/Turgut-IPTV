
name: Turgut IPTV Turkey Ultimate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turgut-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update IPTV
        run: |
          cat > updater.py <<'PY'
          import requests
          import re
          import json
          import unicodedata
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          MAIN = Path("Turgut.m3u")
          AUTO = Path("Turgut_auto.m3u")
          MANUAL = Path("manual.m3u")
          STATE = Path("stream_state.json")

          MAX_ALTERNATIVES = 5
          MAX_CHANNELS = 6000
          FAIL_LIMIT = 4
          WORKERS = 30
          TIMEOUT = 12

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          SOURCES = [
              "https://iptv-org.github.io/iptv/countries/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/tr.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/verified.m3u",
              "https://shahrukhalid.github.io/nexonic-iptv/playlists/all.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u",
              "https://iptv-org.github.io/iptv/categories/news.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/kids.m3u",
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_turkey.m3u8"
          ]

          TURKISH_CHANNELS = [
              "atv", "a2", "showtv", "show tv",
              "kanald", "kanal d", "startv", "star tv",
              "now", "now tv", "fox", "tv8", "tv85",
              "kanal7", "kanal 7", "beyaztv", "beyaz tv",
              "teve2", "360", "trt1", "trt 1",
              "trt2", "trt 2", "trtbelgesel",
              "trt belgesel", "trtcocuk", "trt çocuk",
              "trtspor", "trt spor", "trthaber",
              "trt haber", "trtmuzik", "trt muzik",
              "trtturk", "trt turk",
              "aspor", "a spor", "htspor", "ht spor",
              "tivibuspor", "tivibu spor", "ssport",
              "s sport", "ntv", "cnnturk", "cnn turk",
              "ahaber", "a haber", "haberturk",
              "haberturk tv", "haberglobal",
              "haber global", "tv100", "sozcutv",
              "sozcu tv", "halktv", "halk tv",
              "tele1", "tvnet", "ulusal kanal",
              "benguturk", "bengutürk", "ekoturk",
              "ekotürk", "bloomberght", "tgrthaber",
              "tgrt haber", "tgrt belgesel",
              "kralpop", "kral pop", "kraltv", "kral tv",
              "powerturk", "power turk", "dreamturk",
              "dream turk", "number one turk",
              "number one türk", "slowturk", "slow turk",
              "powerpop", "power pop",
              "minika", "minikago", "minika go",
              "cartoon network turkiye",
              "cnbce", "cnbc e", "kanalb", "kanal b",
              "flashhaber", "flash haber", "tvem",
              "tv em", "kanal3", "kanal 3",
              "kanal26", "kanal 26", "kanal33",
              "kanal 33", "kontv", "kon tv",
              "ostimtv", "ostim tv", "meltemtv",
              "meltem tv", "kanalurfa", "kanal urfa",
              "kanal23", "kanal 23", "linetv",
              "line tv", "ercistv", "ercis tv",
              "tvden", "tv den", "ege tv",
              "kanal ege", "kanal v", "tv kayseri",
              "bursa tv", "konya tv", "ordu tv",
              "mavi karadeniz", "yerel tv",
              "tv 5", "tv5", "kanal avrupa",
              "kanal 7 avrupa", "tgrt eu"
          ]

          FOREIGN_BLOCK = [
              "aljazeera", "aljazeer",
              "mbc", "rotana", "dubaisports",
              "abudhabi", "alkass", "shahid",
              "osn", "bein", "beinsports",
              "espn", "foxsports", "skysports",
              "supersport", "sscsaudi",
              "arabic", "arab", "iraq",
              "iran", "syria", "egypt",
              "saudi", "kuwait", "qatar",
              "oman", "bahrain", "yemen",
              "jordan", "lebanon", "morocco",
              "algeria", "tunisia", "libya",
              "palestine", "pakistan", "india",
              "bangladesh", "afghanistan",
              "germany", "deutschland",
              "france", "italy", "spain",
              "portugal", "unitedkingdom",
              "england", "usa", "america",
              "canada", "brazil", "mexico",
              "peru", "argentina", "chile",
              "colombia", "ecuador", "bolivia",
              "venezuela", "uruguay", "paraguay",
              "world", "international"
          ]

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )
              value = value.lower()
              value = re.sub(
                  r"\b(hd|fhd|uhd|4k|sd|720p|1080p)\b",
                  "",
                  value
              )
              return re.sub(r"[^a-z0-9]", "", value)

          ALLOWED = {
              normalize(x) for x in TURKISH_CHANNELS
          }

          def parse_m3u(content):
              result = []
              info = None

              for line in content.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      info = line

                  elif (
                      line.startswith(("http://", "https://"))
                      and info
                  ):
                      result.append((info, line))
                      info = None

              return result

          def read_m3u(path):
              if not path.exists():
                  return []

              try:
                  return parse_m3u(
                      path.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  )
              except Exception:
                  return []

          def channel_name(entry):
              match = re.search(r",(.+)$", entry[0])
              return match.group(1).strip() if match else ""

          def is_turkish(entry):
              info = entry[0]
              name = channel_name(entry)
              normalized = normalize(name)

              if not normalized:
                  return False

              # Arap alfabesi ve Arapça yayınları reddet
              if re.search(
                  r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",
                  name
              ):
                  return False

              # Açık yabancı ülke bilgisi varsa reddet
              country = re.search(
                  r'tvg-country="([^"]+)"',
                  info,
                  re.I
              )

              if country:
                  codes = [
                      x.strip().upper()
                      for x in country.group(1).split(",")
                  ]

                  if not codes or any(
                      x not in ("TR", "TUR", "TURKEY", "TÜRKİYE")
                      for x in codes
                  ):
                      return False

              # Yabancı kanal isimlerini reddet
              if any(
                  normalize(x) in normalized
                  for x in FOREIGN_BLOCK
              ):
                  return False

              # Türkiye kanal adıyla eşleşme
              if normalized in ALLOWED:
                  return True

              # Açık Türkiye ülke bilgisi olan yerel kanallar
              if country:
                  return True

              return False

          def channel_key(entry):
              match = re.search(
                  r'tvg-id="([^"]+)"',
                  entry[0],
                  re.I
              )

              return normalize(
                  match.group(1)
                  if match else channel_name(entry)
              ) or entry[1]

          def category(entry):
              n = normalize(channel_name(entry))

              if any(x in n for x in [
                  "trtspor", "aspor", "htspor",
                  "tivibuspor", "ssport"
              ]):
                  return "Türkiye Spor"

              if any(x in n for x in [
                  "ntv", "cnnturk", "ahaber",
                  "haberturk", "haberglobal",
                  "trthaber", "tv100", "sozcutv",
                  "halktv", "tele1", "tvnet"
              ]):
                  return "Türkiye Haber"

              if any(x in n for x in [
                  "kral", "powerturk", "dreamturk",
                  "numberone", "slowturk",
                  "trtmuzik", "powerpop"
              ]):
                  return "Türkiye Müzik"

              if any(x in n for x in [
                  "trtcocuk", "minika",
                  "cartoonnetwork"
              ]):
                  return "Türkiye Çocuk"

              if any(x in n for x in [
                  "belgesel", "discovery",
                  "natgeo", "history"
              ]):
                  return "Türkiye Belgesel"

              if any(x in n for x in [
                  "film", "sinema", "movie"
              ]):
                  return "Türkiye Film"

              return "Türkiye Ulusal"

          def set_category(info, group):
              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  re.I
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      info,
                      count=1,
                      flags=re.I
                  )

              return info.replace(
                  "#EXTINF:-1",
                  '#EXTINF:-1 group-title="' + group + '"',
                  1
              )

          def unique(entries):
              result = []
              seen = set()

              for info, url in entries:
                  url = url.strip()

                  if (
                      url.startswith(("http://", "https://"))
                      and url not in seen
                  ):
                      seen.add(url)
                      result.append((info, url))

              return result

          def download_source(url):
              try:
                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=25
                  )

                  if r.status_code == 200:
                      entries = parse_m3u(r.text)
                      print("SOURCE:", url, len(entries))
                      return entries

                  print("SOURCE HTTP:", r.status_code, url)

              except Exception as e:
                  print("SOURCE ERROR:", url, str(e))

              return []

          def probe(url):
              try:
                  r = requests.get(
                      url,
                      headers={
                          **HEADERS,
                          "Range": "bytes=0-4095"
                      },
                      timeout=(8, TIMEOUT),
                      stream=True,
                      allow_redirects=True
                  )

                  if r.status_code in (
                      401, 403, 407, 429, 451
                  ):
                      r.close()
                      return "hold"

                  if r.status_code in (404, 410):
                      r.close()
                      return "bad"

                  if r.status_code >= 500 or r.status_code in (
                      408, 425
                  ):
                      r.close()
                      return "retry"

                  if r.status_code >= 400:
                      r.close()
                      return "bad"

                  data = r.raw.read(4096)
                  content_type = r.headers.get(
                      "Content-Type", ""
                  ).lower()

                  r.close()

                  if not data or "text/html" in content_type:
                      return "bad"

                  if data.lstrip().lower().startswith(
                      (b"<html", b"<!doctype html")
                  ):
                      return "bad"

                  return "ok"

              except requests.RequestException:
                  return "retry"

              except Exception:
                  return "retry"

          def read_state():
              try:
                  return json.loads(
                      STATE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def write_m3u(path, entries):
              lines = ["#EXTM3U"]

              for info, url in entries:
                  lines.extend([info, url])

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          def main():
              print("TURGUT TURKEY IPTV START")

              current = read_m3u(MAIN)
              previous = read_m3u(AUTO)
              manual_old = read_m3u(MANUAL)

              previous_urls = {
                  url for _, url in previous
              }

              # Ana listedeki eski manuel girişleri kurtar
              manual_new = [
                  e for e in current
                  if e[1] not in previous_urls
              ]

              manual = unique(
                  manual_old + manual_new
              )

              # Manuel listede de yalnızca Türk kanalları
              manual = [
                  e for e in manual
                  if is_turkish(e)
              ]

              manual_urls = {
                  url for _, url in manual
              }

              fetched = []

              with ThreadPoolExecutor(max_workers=10) as pool:
                  for entries in pool.map(
                      download_source, SOURCES
                  ):
                      fetched.extend(entries)

              if not fetched and not previous:
                  raise RuntimeError(
                      "Hiçbir kaynaktan veri alınamadı."
                  )

              # Yeni kaynaklar ve eski otomatik liste
              candidates = unique(fetched + previous)

              candidates = [
                  e for e in candidates
                  if is_turkish(e)
                  and e[1] not in manual_urls
              ]

              # Aynı kanalın alternatiflerini birleştir
              groups = {}

              for entry in candidates:
                  groups.setdefault(
                      channel_key(entry), []
                  ).append(entry)

              limited = []

              for entries in groups.values():
                  limited.extend(
                      entries[:MAX_ALTERNATIVES]
                  )

              limited = limited[:MAX_CHANNELS]

              state = read_state()
              new_state = {}

              all_entries = unique(
                  limited + manual
              )

              print(
                  "TURKISH STREAMS:",
                  len(all_entries)
              )

              with ThreadPoolExecutor(
                  max_workers=WORKERS
              ) as pool:
                  results = list(
                      pool.map(
                          probe,
                          [e[1] for e in all_entries]
                      )
                  )

              auto_working = []
              manual_working = []
              removed = 0

              for entry, result in zip(
                  all_entries, results
              ):
                  url = entry[1]
                  old = state.get(url, {})

                  failures = int(
                      old.get("fail_count", 0)
                  )

                  if result == "ok":
                      failures = 0
                  elif result == "hold":
                      pass
                  else:
                      failures += 1

                  if failures >= FAIL_LIMIT:
                      removed += 1
                      print(
                          "REMOVED:",
                          channel_name(entry)
                      )
                      continue

                  new_state[url] = {
                      "fail_count": failures,
                      "last_checked": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "status": result
                  }

                  updated = (
                      set_category(
                          entry[0],
                          category(entry)
                      ),
                      url
                  )

                  if url in manual_urls:
                      manual_working.append(updated)
                  else:
                      auto_working.append(updated)

              auto_working = unique(auto_working)
              manual_working = unique(manual_working)

              auto_working.sort(
                  key=lambda e: (
                      category(e),
                      channel_key(e)
                  )
              )

              manual_working.sort(
                  key=lambda e: (
                      category(e),
                      channel_key(e)
                  )
              )

              final_entries = unique(
                  manual_working + auto_working
              )

              # Ani kaynak düşüşünde eski listeyi koru
              if (
                  previous
                  and len(auto_working) < len(previous) * 0.20
                  and len(fetched) < 20
              ):
                  raise RuntimeError(
                      "Kaynaklarda ani düşüş var. "
                      "Mevcut dosyalar korundu."
                  )

              write_m3u(AUTO, auto_working)
              write_m3u(MANUAL, manual_working)
              write_m3u(MAIN, final_entries)

              STATE.write_text(
                  json.dumps(
                      new_state,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              counts = {}

              for entry in final_entries:
                  group = category(entry)
                  counts[group] = (
                      counts.get(group, 0) + 1
                  )

              print("--------------------------------")
              print("Automatic:", len(auto_working))
              print("Manual:", len(manual_working))
              print("Removed:", removed)
              print("Total:", len(final_entries))
              print("CATEGORIES:")

              for group, count in sorted(counts.items()):
                  print(group, count)

              print("TURKEY ONLY UPDATE COMPLETE")

          if __name__ == "__main__":
              main()
          PY

          python updater.py

      - name: Save playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Turgut Turkey IPTV hourly update"
          file_pattern: "Turgut.m3u Turgut_auto.m3u manual.m3u stream_state.json"
